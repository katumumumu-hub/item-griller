<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アニマスクイズ - ワンピースモード</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* 海賊風のテーマ設定 */
  :root {
    --primary: #c0392b; /* 海賊旗レッド */
    --secondary: #f1c40f; /* 財宝ゴールド */
    --accent: #2980b9; /* グランドラインブルー */
    --bg-color: #fbe0c3; /* 羊皮紙 */
    --text-main: #2c3e50; /* 濃いインク色 */
    --white: #ffffff;
    --border-color: #3e1c14; /* 焦げ茶（木枠） */
    --wood-bg: #5c2a21; /* 木板 */
  }

  body {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    background-color: #111; /* 黒い背景 */
    background-image: repeating-linear-gradient(45deg, #1a1a1a 25%, transparent 25%, transparent 75%, #1a1a1a 75%, #1a1a1a), repeating-linear-gradient(45deg, #1a1a1a 25%, #111 25%, #111 75%, #1a1a1a 75%, #1a1a1a);
    background-position: 0 0, 10px 10px;
    background-size: 20px 20px;
    color: var(--text-main);
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-weight: 900;
  }

  #app {
    width: 100%;
    max-width: 400px;
    background-color: var(--bg-color);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    border-left: 6px solid var(--border-color);
    border-right: 6px solid var(--border-color);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
  }
  @media (min-width: 401px) {
    #app { 
      min-height: 800px;
      height: 95vh; 
      border-radius: 12px; 
      border: 8px solid var(--border-color); 
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 8px 8px 0px rgba(0,0,0,0.8);
    }
  }

  /* 画面切り替えアニメーション */
  .screen { display: none; padding: 10px; box-sizing: border-box; height: 100%; overflow-y: auto; flex-direction: column; }
  .screen.active { display: flex; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  @keyframes popIn { 
    from { opacity: 0; transform: scale(0.9) translateY(20px); } 
    to { opacity: 1; transform: scale(1) translateY(0); } 
  }

  /* ホーム画面はスクロール無効化し全体を綺麗に1画面に収める */
  #home-screen {
    overflow-y: hidden;
    justify-content: space-between;
  }

  /* 共通ヘッダー（木看板風） */
  .header {
    background: var(--wood-bg);
    color: var(--secondary);
    text-align: center; padding: 10px; border-radius: 12px; margin-bottom: 12px;
    font-weight: 900; font-size: 20px; border: 3px solid var(--border-color);
    box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
    text-shadow: 2px 2px 0 #000;
    letter-spacing: 2px;
  }
  
  /* ホーム画面のアニマス名表示 */
  .animas-name {
    text-align: center; padding: 6px;
    background-color: var(--secondary);
    border-radius: 15px; border: 3px solid var(--border-color); box-shadow: 4px 4px 0px var(--border-color);
    margin-bottom: 6px; font-size: 13px; color: var(--border-color);
  }
  #animas-title {
    font-size: 22px; color: var(--primary); display: block; margin-top: 2px; text-shadow: 2px 2px 0 var(--white);
  }

  /* ステータスバー */
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--wood-bg);
    padding: 6px 12px; border-radius: 12px;
    border: 3px solid var(--border-color); box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
    margin-bottom: 6px; font-weight: 900;
    color: var(--white);
  }
  .life-area { text-align: right; }
  .life-icons { letter-spacing: 2px; text-shadow: 1px 1px 0px #000; }
  #life-timer { font-size: 11px; color: var(--secondary); background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 10px; display: inline-block; margin-top: 4px; border: 2px solid #000; font-weight: 900;}

  /* 棒グラフ用のコンテナ（ズレ修正済） */
  .chart-container {
    position: relative;
    background: transparent; border: none; box-shadow: none;
    padding: 0px 5px; margin: 6px 0; flex-grow: 1; min-height: 220px;
    width: 100%;
    box-sizing: border-box;
  }
  /* canvas要素への強制サイズ指定はChart.jsの描画ズレを引き起こすため削除 */

  /* モード選択に戻るボタン */
  .btn-back-mode {
    width: 100%; padding: 8px; margin-bottom: 0px; background: var(--wood-bg);
    color: var(--secondary); font-weight: 900; font-size: 15px;
    border: 3px solid var(--border-color); border-radius: 12px; cursor: pointer;
    box-shadow: 0 4px 0px rgba(0,0,0,0.5); transition: all 0.1s; text-shadow: 1px 1px 0 #000;
  }
  .btn-back-mode:active { transform: translateY(4px); box-shadow: 0 0px 0 rgba(0,0,0,0.5); }

  /* メインアクションボタン */
  .action-btn {
    width: 100%; padding: 12px; border: 3px solid var(--border-color) !important; border-radius: 15px;
    background: linear-gradient(135deg, var(--primary) 0%, #8e1a0e 100%) !important; color: var(--secondary) !important; font-size: 18px; font-weight: 900; margin-bottom: 6px; cursor: pointer; box-shadow: 0 4px 0px var(--border-color); transition: transform 0.1s, box-shadow 0.1s; text-shadow: 2px 2px 0 #000; font-family: 'M PLUS Rounded 1c', sans-serif;
  }
  .action-btn:active { transform: translateY(4px); box-shadow: 0 0px 0 var(--border-color); }
  .action-btn:disabled { background: #7f8c8d !important; box-shadow: 0 4px 0 #2c3e50 !important; border-color: #2c3e50 !important; text-shadow: none !important; cursor: not-allowed; transform: none; color: #bdc3c7 !important; }

  /* サブボタン */
  .share-area, .history-link { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
  .share-area button, .history-link button {
    flex: 1; padding: 6px 4px; border: 3px solid var(--border-color); border-radius: 10px; font-weight: 900;
    cursor: pointer; transition: all 0.1s; font-size: 13px; box-shadow: 0 3px 0px var(--border-color);
  }
  .share-area button { background: #fff8e7; color: var(--text-main); }
  .history-link button { background-color: var(--wood-bg); color: var(--secondary); font-size: 12px; text-shadow: 1px 1px 0 #000; }
  .share-area button:active, .history-link button:active { transform: translateY(3px); box-shadow: 0 0px 0 var(--border-color); }

  /* ランキングタブ */
  .ranking-tabs { display: flex; gap: 5px; margin-bottom: 10px; }
  .ranking-tab { flex: 1; padding: 10px; text-align: center; font-weight: 900; font-size: 14px; border: 3px solid var(--border-color); border-radius: 10px; background: #fff8e7; color: var(--text-main); cursor: pointer; transition: 0.2s; box-shadow: 0 3px 0 var(--border-color); }
  .ranking-tab:active { transform: translateY(3px); box-shadow: 0 0 0 var(--border-color); }
  .ranking-tab.active-tab { background: var(--primary); color: var(--secondary); text-shadow: 1px 1px 0 #000; }

  /* --- 回答画面要素 --- */
  .quiz-info {
    background: var(--wood-bg); color: var(--secondary); text-shadow: 1px 1px 0 #000;
    border: 3px solid var(--border-color); padding: 10px; text-align: center; border-radius: 12px;
    box-shadow: 4px 4px 0px rgba(0,0,0,0.5); margin-bottom: 15px; font-weight: 900; font-size: 15px;
  }
  .timer-bar {
    width: 100%; height: 16px; background-color: #3e1c14; border-radius: 8px;
    border: 3px solid var(--border-color); margin-bottom: 15px; overflow: hidden; box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
  }
  .timer-fill { height: 100%; background: linear-gradient(90deg, var(--secondary) 0%, #e67e22 100%); width: 100%; transition: width 1s linear; }
  .question-area {
    background: #fff8e7; color: var(--text-main); text-shadow: none; min-height: 100px;
    padding: 15px; border-radius: 15px; border: 3px solid var(--border-color);
    margin-bottom: 15px; display: flex; align-items: center; justify-content: center;
    font-size: 17px; text-align: center; font-weight: 900; line-height: 1.5;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.1), 4px 4px 0px var(--border-color); flex-grow: 1;
  }
  .choice-btn {
    width: 100%; padding: 14px; margin-bottom: 10px; border: 3px solid var(--border-color);
    background-color: #fff8e7; cursor: pointer; font-size: 15px; text-align: center; border-radius: 12px; font-weight: 900;
    color: var(--text-main); box-shadow: 0 4px 0px var(--border-color); transition: transform 0.1s, background 0.2s;
    font-family: 'M PLUS Rounded 1c', sans-serif;
  }
  .choice-btn:active { transform: translateY(4px); box-shadow: 0 0px 0 var(--border-color); background-color: #f1ddb3; }
  
  /* --- 履歴・統計・称号画面リスト --- */
  .custom-list, .stats-container {
    background: #fff8e7; overflow-y: auto; margin-bottom: 15px; flex-grow: 1;
    padding: 15px; border-radius: 15px; border: 3px solid var(--border-color); box-shadow: inset 0 0 10px rgba(0,0,0,0.05), 4px 4px 0px var(--border-color); font-size: 14px; font-weight: 900;
  }
  .custom-list::-webkit-scrollbar, .stats-container::-webkit-scrollbar { width: 8px; }
  .custom-list::-webkit-scrollbar-thumb, .stats-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
  .stats-section { margin-bottom: 15px; }
  .stats-section:last-child { margin-bottom: 0; }
  .stats-section-title { color: var(--secondary); background: var(--wood-bg); display: inline-block; padding: 4px 10px; border-radius: 8px; margin-bottom: 10px; border: 2px solid var(--border-color); font-size: 15px; text-shadow: 1px 1px 0 #000;}
  .stats-row { display: flex; justify-content: space-between; padding: 6px 0; color: var(--text-main); border-bottom: 2px dashed #d2dae2; }

  /* 履歴リストアイテム */
  .history-item { padding: 12px 10px; border-bottom: 3px dashed #d2dae2; font-weight: 900; }
  .history-item:last-child { border-bottom: none; }
  .history-item.correct { color: #27ae60; text-shadow: 1px 1px 0px rgba(0,0,0,0.1); }
  .history-item.incorrect { color: var(--primary); text-shadow: 1px 1px 0px rgba(0,0,0,0.1); }

  /* 称号アイテム */
  .title-item {
    border: 3px solid var(--border-color); padding: 12px; display: flex;
    justify-content: space-between; align-items: center; background-color: #fff8e7; margin-bottom: 12px; border-radius: 12px; box-shadow: 2px 2px 0px var(--border-color);
  }
  .title-item.locked { background: #d2dae2; box-shadow: none; border-color: #808e9b; color: #808e9b;}
  .title-info { flex: 1; margin-right: 10px; }
  .title-name { font-weight: 900; font-size: 15px; margin-bottom: 4px; color: var(--primary); }
  .title-item.locked .title-name { color: #808e9b; }
  .title-desc { font-size: 12px; color: #2c3e50; font-weight: 900; }
  .title-item.locked .title-desc { color: #808e9b; }
  
  .title-btn {
    padding: 8px 12px; background: var(--wood-bg); border: 3px solid var(--border-color); color: var(--secondary);
    border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: 900;
    box-shadow: 0 3px 0px var(--border-color); transition: all 0.1s; text-shadow: 1px 1px 0 #000;
  }
  .title-btn:active { transform: translateY(3px); box-shadow: 0 0px 0 var(--border-color); }
  .title-btn.current { background: var(--secondary); color: var(--text-main); text-shadow: none; }
  .title-btn:disabled { background: #808e9b; color: #d2dae2; border-color: #808e9b; box-shadow: none; cursor: not-allowed; transform: none; text-shadow: none;}

  /* モーダル群 */
  .modal-overlay {
    display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.85); z-index: 100; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
  }
  .modal-overlay.active { display: flex; animation: fadeInModal 0.3s ease; }
  .modal-content {
    background: radial-gradient(circle, var(--bg-color) 0%, #e1b12c 100%); padding: 20px; border-radius: 20px; width: 100%;
    max-height: 80vh; overflow-y: auto; border: 4px solid var(--border-color); box-shadow: 8px 8px 0px #000;
    text-align: center; animation: popModal 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .modal-content::-webkit-scrollbar { width: 6px; }
  .modal-content::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
  @keyframes fadeInModal { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popModal { from { transform: scale(0.5) rotate(-10deg); } to { transform: scale(1) rotate(0deg); } }
  
  .modal-title {
    color: var(--primary); text-shadow: 2px 2px 0px #fff; font-size: 26px;
    margin-top: 0; margin-bottom: 20px; font-weight: 900; animation: flashText 1.5s infinite;
  }
  .new-title-item {
    background: #fff8e7; border: 3px solid var(--border-color); border-radius: 15px;
    padding: 15px; margin-bottom: 15px; box-shadow: 4px 4px 0px var(--border-color);
  }
  .new-title-label { font-size: 12px; color: var(--primary); font-weight: 900; margin-bottom: 5px; }
  .new-title-name { font-size: 20px; color: var(--primary); font-weight: 900; margin-bottom: 8px; }
  .new-title-desc { font-size: 13px; color: var(--text-main); font-weight: 900; }
</style>
</head>
<body>

<div id="app">

  <div id="home-screen" class="screen active">
    <div style="text-align: center; font-size: 18px; font-weight: 900; margin-bottom: 5px; color: var(--text-main);">
      👤 <span id="top-player-name" style="color: var(--primary);">ゲスト</span> さん
    </div>

    <div class="animas-name">あなたの海賊称号<br><strong id="animas-title">海賊見習い</strong></div>
    
    <div class="status-bar">
      <div>
        <div style="font-size:14px; text-shadow: 1px 1px 0 #000;">総回答数 <span id="total-answers" style="color:#ff7675; font-size:18px;">0</span> 問</div>
        <div style="font-size:12px; margin-top:2px; text-shadow: 1px 1px 0 #000;">総獲得pt <span id="total-points" style="color:var(--secondary); font-size:16px;">0</span> pt</div>
        <div style="font-size:12px; margin-top:2px; text-shadow: 1px 1px 0 #000;">正解率 <span id="correct-rate" style="color:#0be881; font-size:16px; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;">0</span> %</div>
      </div>
      <div class="life-area">
        <div class="life-icons" id="life-icons">💙💙💙💙💙</div>
        <div id="life-timer">MAX</div>
      </div>
    </div>

    <div class="chart-container"><canvas id="barChart"></canvas></div>

    <button class="action-btn" id="start-btn" onclick="startQuiz()" disabled>データ読み込み中...</button>
    
    <button id="ad-recover-btn" class="action-btn" style="display: none; background: linear-gradient(135deg, #2ed573 0%, #1e8449 100%) !important; margin-bottom: 6px;" onclick="watchAdToRecover()">
      📺 広告を見てライフ全回復！
    </button>

    <div class="share-area">
      <button onclick="shareResult('copy')">📋 コピー</button>
      <button onclick="shareResult('line')" style="color:#05c46b;">💬 LINE</button>
      <button onclick="shareResult('x')" style="color:var(--text-main);">𝕏 Post</button>
    </div>
    
    <div class="history-link">
      <button onclick="showTitleScreen()">🏴‍☠️ 称号</button>
      <button onclick="showRankingScreen()" style="background:linear-gradient(135deg, #e1b12c 0%, #f1c40f 100%); color:#000; text-shadow:1px 1px 0 var(--white);">☠️ ﾗﾝｷﾝｸﾞ</button>
      <button onclick="showScreen('history-screen')">🗺️ 航海日誌</button>
    </div>

    <button class="btn-back-mode" onclick="window.location.href='../index.html'">⬅️ モード選択に戻る</button>
  </div>

  <div id="quiz-screen" class="screen">
    <div class="header">🌟 ワンピース 🌟 <span style="float:right; font-size:14px; margin-top:2px;" id="quiz-level-display">Lv1</span></div>
    <div class="quiz-info" id="quiz-genre">【 ワンピース 】<br>〇〇編</div>
    <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
    <div class="question-area" id="quiz-text">問題文</div>
    <div id="choices-area"></div>
  </div>

  <div id="history-screen" class="screen">
    <div class="header">🗺️ 航海日誌</div>
    <div class="stats-container" id="stats-area"></div>
    <button class="action-btn" onclick="showScreen('home-screen')">🏠 ホームに戻る</button>
  </div>

  <div id="title-screen" class="screen">
    <div class="header">🏴‍☠️ 称号コレクション</div>
    <div class="custom-list" id="title-list"></div>
    <button class="action-btn" onclick="showScreen('home-screen')">🏠 ホームに戻る</button>
  </div>

  <div id="ranking-screen" class="screen">
    <div class="header">☠️ 懸賞金ランキング</div>
    
    <div class="ranking-tabs">
      <div id="ranking-tab-point" class="ranking-tab active-tab" onclick="loadRankingData('point')">総合ポイント</div>
      <div id="ranking-tab-rate" class="ranking-tab" onclick="loadRankingData('rate')">正解率</div>
    </div>
    
    <div class="custom-list" id="ranking-list-area" style="padding: 10px;">
      </div>

    <button class="action-btn" onclick="showScreen('home-screen')">🏠 ホームに戻る</button>
  </div>
  
  <div id="title-unlock-modal" class="modal-overlay">
    <div class="modal-content">
      <h2 class="modal-title">🎉 新称号 獲得!! 🎉</h2>
      <div id="unlocked-titles-container"></div>
      <button class="action-btn" style="margin-bottom:0;" onclick="closeTitleModal()">OK!</button>
    </div>
  </div>

</div>

<script>
  // --- 効果音システム ---
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let audioCtx;

  function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playTone(freq, type, duration, vol=0.1) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
  }
  function playClick() { initAudio(); playTone(800, 'sine', 0.05, 0.05); }
  function playCorrectSound() { initAudio(); playTone(523.25, 'sine', 0.1, 0.1); setTimeout(() => playTone(659.25, 'sine', 0.1, 0.1), 100); setTimeout(() => playTone(783.99, 'sine', 0.3, 0.1), 200); }
  function playIncorrectSound() { initAudio(); playTone(200, 'sawtooth', 0.2, 0.1); setTimeout(() => playTone(150, 'sawtooth', 0.4, 0.1), 150); }

  // --- 全体共通変数 ---
  let questionsData = [];
  let titlesData = [];
  let isDataLoaded = false;
  let playerName = localStorage.getItem('animasPlayerName') || 'ゲスト';

  // ワンピースの編一覧（順番定義用）
  const OP_ARCS = ["東の海編", "アラバスタ編", "空島編", "ウォーターセブン編", "スリラーバーク編", "シャボンディ編", "頂上戦争編", "魚人島編", "パンクハザード編", "ドレスローザ編", "ゾウ編", "ホールケーキアイランド編", "ワノ国編", "エッグヘッド編"];

  // --- 非同期でJSONデータを読み込む処理 ---
  async function loadGameData() {
    try {
      const qRes = await fetch('./onepiece.json');
      if (!qRes.ok) throw new Error(`HTTP ${qRes.status}`);
      let rawQuestions = await qRes.json();

      questionsData = rawQuestions.map((q, index) => {
        let choices = [q["選択肢A"], q["選択肢B"], q["選択肢C"], q["選択肢D"]].filter(c => c !== undefined && c !== null && c !== "");
        let correctIdx = choices.indexOf(q["正解"]);
        if(correctIdx === -1) correctIdx = 0; 

        let levelNum = parseInt((q["難易度"] || "").replace(/[^0-9]/g, '')) || 1;
        let genreStr = q["編"] || "不明な編";

        return {
          id: q["ID"] || ("op_" + index),
          level: levelNum,
          anime: "ワンピース",
          genre: genreStr,
          text: q["問題文"],
          choices: choices,
          correctIndex: correctIdx
        };
      });

      const allArcs = [...new Set(questionsData.map(q => q.genre))];
      allArcs.forEach(arc => {
        if (appData.stats[arc] === undefined) {
          appData.stats[arc] = 0;
        }
      });

      try {
        const tRes = await fetch('./titles.json');
        if (tRes.ok) {
          const rawTitles = await tRes.json();
          titlesData = rawTitles.map(t => {
            t.check = function(d) {
              let earned = 0;
              Object.values(d.stats).forEach(v => earned += v);

              if (t.id === 1) return true;
              
              if (t.id >= 2 && t.id <= 10) {
                const reqs = [10, 50, 100, 300, 500, 1000, 2000, 5000, 10000];
                return earned >= reqs[t.id - 2];
              }
              
              if (t.id >= 11 && t.id <= 150) {
                const arcIndex = Math.floor((t.id - 11) / 10);
                const arcName = OP_ARCS[arcIndex];
                if (!arcName) return false;
                
                const subId = (t.id - 11) % 10;
                const arcPts = d.stats[arcName] || 0;
                
                let isTop = true;
                Object.keys(d.stats).forEach(k => {
                  if (d.stats[k] > arcPts) isTop = false;
                });

                if (subId < 9) {
                  const reqs = [20, 50, 100, 200, 300, 500, 1000, 2000, 5000];
                  return arcPts >= reqs[subId] && isTop;
                } else {
                  return earned > 0 && (arcPts / earned) >= 0.8;
                }
              }
              
              if (t.id >= 151 && t.id <= 170) {
                const req = (t.id % 2 !== 0) ? 50 : 300;
                const sortedPts = Object.values(d.stats).sort((a,b)=>b-a);
                if (sortedPts.length < 2) return false;
                return sortedPts[0] >= req && sortedPts[1] >= req && (sortedPts[0] - sortedPts[1]) <= 20;
              }
              
              if (t.id >= 171 && t.id <= 175) {
                const reqs = [50, 100, 300, 500, 1000];
                const req = reqs[t.id - 171];
                for (let arc of OP_ARCS) {
                  if ((d.stats[arc] || 0) < req) return false;
                }
                return true;
              }
              
              if (t.id >= 176 && t.id <= 180) {
                const reqs = [100, 500, 1000, 2000, 5000];
                return d.totalAnswers >= reqs[t.id - 176];
              }
              if (t.id >= 181 && t.id <= 185) {
                const reqs = [100, 300, 500, 800, 1000];
                const uniqueAnswers = new Set(d.answeredQuestions).size;
                return uniqueAnswers >= reqs[t.id - 181];
              }

              return false; 
            };
            return t;
          });
        }
      } catch (titleError) {
        console.warn("titles.json の読み込みをスキップしました");
      }

      document.getElementById('start-btn').innerText = "☠️ クイズに出航する！";
      document.getElementById('start-btn').disabled = false;
      
      isDataLoaded = true;
      init();
    } catch (error) {
      console.error(error);
      alert("データの読み込みに失敗しました。onepiece.jsonが存在するか確認してください。");
    }
  }

  // --- データ保存・初期化 (localStorage) ---
  const DEFAULT_DATA = {
    life: 5, lastLifeTime: Date.now(),
    stats: {}, // 全ての〇〇編が動的に格納される
    answeredQuestions: [], totalAnswers: 0, totalCorrects: 0, history: [],
    unlockedTitles: [1], currentTitleId: 1,
    statistics: { arc: {}, level: {} }
  };
  
  let appData = JSON.parse(localStorage.getItem('animasOnepieceData')) || DEFAULT_DATA;
  
  if (!appData.stats) appData.stats = {};
  OP_ARCS.forEach(arc => {
    if (typeof appData.stats[arc] === 'undefined') appData.stats[arc] = 0;
  });
  if (!appData.unlockedTitles) appData.unlockedTitles = [1];
  if (!appData.currentTitleId) appData.currentTitleId = 1;
  if (!appData.statistics) appData.statistics = { arc: {}, level: {} };
  if (typeof appData.totalCorrects === 'undefined') appData.totalCorrects = 0;
  
  let isAnswering = false;
  let timerInterval; let timeLeft = 10;
  let currentQuestion = null; let barChart;
  
  function init() {
    playerName = localStorage.getItem('animasPlayerName') || 'ゲスト';
    document.getElementById('top-player-name').innerText = playerName;
    
    initChart(); checkTitleUnlocks(); updateHomeUI(); renderHistory(); setInterval(checkLifeRecovery, 1000);
  }

  function saveData() { localStorage.setItem('animasOnepieceData', JSON.stringify(appData)); }

  // --- 広告を見て回復する処理 ---
  function watchAdToRecover() {
    playClick();
    const btn = document.getElementById('ad-recover-btn');
    btn.disabled = true; btn.innerText = "⏳ 広告を再生中..."; 
    setTimeout(() => {
      appData.life = 5; appData.lastLifeTime = Date.now();
      saveData(); updateHomeUI(); 
      alert("広告の視聴が完了しました！\nライフが全回復しました！💙");
      btn.disabled = false; btn.innerText = "📺 広告を見てライフ全回復！";
    }, 2000); 
  }

  // --- ランキングAPI ---
  let currentRankingTab = 'point';

  function showRankingScreen() {
    playClick();
    playerName = localStorage.getItem('animasPlayerName') || 'ゲスト';
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('ranking-screen').classList.add('active');
    loadRankingData('point');
  }

  async function loadRankingData(type) {
    playClick();
    currentRankingTab = type;
    document.getElementById('ranking-tab-point').classList.toggle('active-tab', type === 'point');
    document.getElementById('ranking-tab-rate').classList.toggle('active-tab', type === 'rate');
    
    const listArea = document.getElementById('ranking-list-area');
    listArea.innerHTML = '<div style="text-align:center; padding:30px; font-size:18px; color:var(--primary);">通信中...</div>';
    
    let myTotalPt = 0;
    Object.values(appData.stats).forEach(v => myTotalPt += v);
    const myRate = appData.totalAnswers > 0 ? Math.floor((appData.totalCorrects / appData.totalAnswers) * 100) : 0;
    let myVal = type === 'point' ? myTotalPt : myRate;
    let unit = type === 'point' ? 'pt' : '%';
    
    let infoHtml = `<div style="margin-bottom:15px; padding:10px; background:var(--wood-bg); color:var(--secondary); border-radius:10px; border:3px solid var(--border-color); font-weight:900; text-align:center; text-shadow:1px 1px 0 #000;">
        あなたの懸賞金(記録)：[${playerName}] ${myVal}${unit} <br>`;
        
    if (appData.totalAnswers < 100) {
        infoHtml += `<span style="font-size:12px; color:#e15f41; text-shadow:none;">※100問解答でランキングに参加できます (現在:${appData.totalAnswers}問)</span>`;
    } else {
        infoHtml += `<span style="font-size:12px; color:#0be881; text-shadow:none;">✅ ランキング参加中！</span>`;
    }
    infoHtml += `</div>`;

    setTimeout(() => {
        let dummyData = [];
        for(let i=1; i<=30; i++) {
            dummyData.push({
                rank: i,
                name: i === 12 && appData.totalAnswers >= 100 ? playerName : `海賊マスター${i}号`,
                score: 15000 - (i * 350),
                rate: 99 - Math.floor(i * 1.5),
                date: '2026/05/18'
            });
        }
        
        let html = infoHtml;
        dummyData.forEach(d => {
            let val = type === 'point' ? d.score : d.rate;
            let rankColor = d.rank <= 3 ? 'var(--primary)' : 'var(--text-main)';
            let isMe = (d.name === playerName);
            let bgStyle = isMe ? 'background: #f1ddb3;' : '';

            html += `<div style="display:flex; justify-content:space-between; padding:10px; border-bottom:2px dashed #bdc3c7; align-items:center; ${bgStyle}">
                <div style="display:flex; align-items:center; gap:10px;">
                    <span style="font-size:20px; font-weight:900; color:${rankColor}; width:30px; text-align:center;">${d.rank}</span>
                    <span style="font-weight:900; font-size:14px;">${d.name} ${isMe ? '<span style="color:var(--primary); font-size:10px;">(YOU)</span>' : ''}</span>
                </div>
                <div style="text-align:right;">
                    <div style="font-weight:900; color:var(--primary); font-size:16px;">${val}${unit}</div>
                    <div style="font-size:10px; color:#7f8c8d;">${d.date}</div>
                </div>
            </div>`;
        });
        listArea.innerHTML = html;
    }, 800);
  }

  function sendRankingData() {
      if (appData.totalAnswers < 100 || !playerName || playerName === 'ゲスト') return;
  }

  // --- シェア機能 ---
  function getShareText() {
    const t = titlesData.find(x => x.id === appData.currentTitleId);
    const titleName = t ? t.title : "海賊見習い";
    let earnedPts = 0;
    Object.values(appData.stats).forEach(v => earnedPts += v);
    const rate = appData.totalAnswers > 0 ? Math.floor((appData.totalCorrects / appData.totalAnswers) * 100) : 0;
    
    let text = `${playerName} のワンピース称号「${titleName}」✨\n`;
    text += `総獲得pt: ${earnedPts}pt (正解率: ${rate}%)\n\n`;
    text += `#アニマスワンピース #アニメクイズ`;
    return text;
  }

  function shareResult(type) {
    playClick();
    const text = getShareText();
    if (type === 'copy') {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => { alert("コピーしました！\nSNSなどに貼り付けてシェアしてください。"); }).catch(err => { alert("コピーに失敗しました。"); });
      } else { alert("サポートされていません。"); }
    } else if (type === 'line') {
      window.open(`https://line.me/R/msg/text/?${encodeURIComponent(text)}`, '_blank');
    } else if (type === 'x') {
      window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`, '_blank');
    }
  }

  // --- 横棒グラフ ---
  function initChart() {
    const ctx = document.getElementById('barChart').getContext('2d');
    
    let labels = Object.keys(appData.stats);
    let data = Object.values(appData.stats);
    
    if (labels.length === 0) {
      labels = ['データなし'];
      data = [0];
    }

    barChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: '獲得ポイント',
          data: data,
          backgroundColor: 'rgba(192, 57, 43, 0.85)',
          borderColor: '#8B0000',
          borderWidth: 2,
          borderRadius: 4
        }]
      },
      options: { 
        indexAxis: 'y',
        maintainAspectRatio: false,
        responsive: true,
        scales: { 
          x: { 
            beginAtZero: true, 
            ticks: { precision: 0 } 
          },
          y: { 
            ticks: { 
              autoSkip: false,
              font: { family: "'M PLUS Rounded 1c', sans-serif", weight: '900', size: 10 }, 
              color: '#2f3542' 
            } 
          }
        },
        plugins: { legend: { display: false } }
      }
    });
  }

  function updateChart() {
    if (Object.keys(appData.stats).length > 0) {
      barChart.data.labels = Object.keys(appData.stats);
      barChart.data.datasets[0].data = Object.values(appData.stats);
    }
    barChart.update();
  }

  // --- ライフ回復ロジック ---
  function checkLifeRecovery() {
    const RECOVERY_MS = 10 * 60 * 1000;
    if (appData.life >= 5) {
      appData.lastLifeTime = Date.now();
      document.getElementById('life-timer').innerText = "MAX";
      saveData(); return;
    }
    const diff = Date.now() - appData.lastLifeTime;
    if (diff >= RECOVERY_MS) {
      const recovered = Math.floor(diff / RECOVERY_MS);
      appData.life = Math.min(5, appData.life + recovered);
      appData.lastLifeTime += recovered * RECOVERY_MS;
      saveData(); updateHomeUI();
    } else {
      const remainMs = RECOVERY_MS - diff;
      const remainMin = Math.floor(remainMs / (60 * 1000));
      const remainSec = Math.floor((remainMs % (60 * 1000)) / 1000);
      document.getElementById('life-timer').innerText = `あと ${String(remainMin).padStart(2, '0')}:${String(remainSec).padStart(2, '0')}`;
    }
  }

  // --- 画面遷移とUI更新 ---
  function showScreen(screenId) {
    playClick();
    if (screenId === 'history-screen') renderStatistics();
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function updateTitleDisplay() {
    const t = titlesData.find(x => x.id === appData.currentTitleId);
    document.getElementById('animas-title').innerText = t ? t.title : "海賊見習い";
  }

  function updateHomeUI() {
    document.getElementById('total-answers').innerText = appData.totalAnswers;
    
    let earnedPts = 0;
    Object.values(appData.stats).forEach(v => earnedPts += v);
    document.getElementById('total-points').innerText = earnedPts;
    
    const rate = appData.totalAnswers > 0 ? Math.floor((appData.totalCorrects / appData.totalAnswers) * 100) : 0;
    const rateEl = document.getElementById('correct-rate');
    if(rateEl) rateEl.innerText = rate;

    let lifeStr = "";
    for(let i=0; i<5; i++) { lifeStr += (i < appData.life) ? "💙" : "🤍"; }
    document.getElementById('life-icons').innerText = lifeStr;
    updateChart(); updateTitleDisplay();

    const adBtn = document.getElementById('ad-recover-btn');
    if (adBtn) {
      if (appData.life < 5) adBtn.style.display = 'block';
      else adBtn.style.display = 'none';
    }
  }

  // --- クイズ開始 ---
  function startQuiz() {
    playClick();
    if (appData.life <= 0) { alert("ライフが回復するまでお待ちください！"); return; }
    
    const available = questionsData.filter(q => !appData.answeredQuestions.includes(q.id));
    if (available.length === 0) { alert("すべてのクイズをクリアしました！クリアおめでとうございます！"); return; }

    appData.life--; saveData(); updateHomeUI();
    currentQuestion = available[Math.floor(Math.random() * available.length)];
    
    let correctText = currentQuestion.choices[currentQuestion.correctIndex];
    for (let i = currentQuestion.choices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [currentQuestion.choices[i], currentQuestion.choices[j]] = [currentQuestion.choices[j], currentQuestion.choices[i]];
    }
    currentQuestion.correctIndex = currentQuestion.choices.indexOf(correctText);

    document.getElementById('quiz-level-display').innerText = `Lv${currentQuestion.level}`;
    document.getElementById('quiz-genre').innerText = `【 ワンピース 】\n${currentQuestion.genre}`;
    document.getElementById('quiz-text').innerText = currentQuestion.text;
    
    const choicesArea = document.getElementById('choices-area');
    choicesArea.innerHTML = '';
    currentQuestion.choices.forEach((choice, index) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn'; btn.innerText = choice;
      btn.onclick = () => handleAnswer(index, btn);
      choicesArea.appendChild(btn);
    });
    isAnswering = true; timeLeft = 10;
    const timerFill = document.getElementById('timer-fill');
    timerFill.style.transition = 'none'; timerFill.style.width = '100%';
    setTimeout(() => { timerFill.style.transition = 'width 1s linear'; }, 50);
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('quiz-screen').classList.add('active');
    
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--; timerFill.style.width = `${(timeLeft / 10) * 100}%`;
      if (timeLeft <= 0) { 
        clearInterval(timerInterval); 
        setTimeout(() => { if (isAnswering) handleTimeout(); }, 1000);
      }
    }, 1000);
  }

  // --- 統計記録処理 ---
  function recordStatistics(q, isCorrect) {
    if (!appData.statistics) appData.statistics = { arc: {}, level: {} };
    const s = appData.statistics;
    
    if (!s.arc[q.genre]) s.arc[q.genre] = { total: 0, correct: 0 };
    s.arc[q.genre].total++; if (isCorrect) s.arc[q.genre].correct++;
    
    if (!s.level[q.level]) s.level[q.level] = { total: 0, correct: 0 };
    s.level[q.level].total++; if (isCorrect) s.level[q.level].correct++;
  }

  function renderStatistics() {
    if (!appData.statistics) appData.statistics = { arc: {}, level: {} };
    const s = appData.statistics;
    let html = '';

    const makeSection = (title, dataObj, keyPrefix, isLevel = false) => {
      let secHtml = `<div class="stats-section"><div class="stats-section-title">${title}</div>`;
      let keys = Object.keys(dataObj);
      if (keys.length === 0) {
        secHtml += `<div style="color:#999; font-size:12px;">データがありません</div>`;
      } else {
        if (isLevel) {
          keys.sort((a, b) => parseInt(a) - parseInt(b));
        } else {
          // 編はOP_ARCSの順番通りにソート
          keys.sort((a, b) => {
             let idxA = OP_ARCS.indexOf(a); let idxB = OP_ARCS.indexOf(b);
             if(idxA === -1) idxA = 999; if(idxB === -1) idxB = 999;
             return idxA - idxB;
          });
        }
        keys.forEach(k => {
          const d = dataObj[k];
          const rate = d.total > 0 ? Math.round((d.correct / d.total) * 100) : 0;
          secHtml += `<div class="stats-row"><span>${keyPrefix}${k}</span><span>${d.correct}/${d.total}問 (${rate}%)</span></div>`;
        });
      }
      secHtml += `</div>`;
      return secHtml;
    };

    html += makeSection('📌 〇〇編別', s.arc, '');
    html += makeSection('📌 レベル別', s.level, 'Lv ', true);

    document.getElementById('stats-area').innerHTML = html;
  }

  // --- 回答処理 ---
  function handleAnswer(selectedIndex, btnElement) {
    if (!isAnswering) return;
    isAnswering = false;
    clearInterval(timerInterval);
    appData.totalAnswers++;
    const isCorrect = (selectedIndex === currentQuestion.correctIndex);
    const btns = document.querySelectorAll('.choice-btn');

    recordStatistics(currentQuestion, isCorrect);
    
    if (isCorrect) {
      playCorrectSound();
      appData.totalCorrects++;
      btnElement.style.background = '#0be881'; btnElement.style.color = '#fff';
      
      const pt = currentQuestion.level; // レベルの値がそのままポイントになる
      appData.stats[currentQuestion.genre] = (appData.stats[currentQuestion.genre] || 0) + pt;
      
      appData.answeredQuestions.push(currentQuestion.id);
      addHistory(true);
      const newlyUnlocked = checkTitleUnlocks();
      
      saveData();
      sendRankingData();
      
      setTimeout(() => { 
        updateHomeUI(); 
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); 
        document.getElementById('home-screen').classList.add('active'); 
        if (newlyUnlocked.length > 0) showTitleModal(newlyUnlocked);
      }, 1200);
    } else {
      playIncorrectSound();
      btnElement.style.background = '#ff3f34'; btnElement.style.color = '#fff';
      btns[currentQuestion.correctIndex].style.background = '#0be881';
      btns[currentQuestion.correctIndex].style.color = '#fff';
      addHistory(false); 
      const newlyUnlocked = checkTitleUnlocks();
      
      saveData();
      sendRankingData();

      setTimeout(() => { 
        updateHomeUI(); 
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); 
        document.getElementById('home-screen').classList.add('active'); 
        if (newlyUnlocked.length > 0) showTitleModal(newlyUnlocked);
      }, 2000);
    }
  }

  function handleTimeout() {
    if (!isAnswering) return;
    isAnswering = false; appData.totalAnswers++;
    playIncorrectSound(); recordStatistics(currentQuestion, false);
    const btns = document.querySelectorAll('.choice-btn');
    btns[currentQuestion.correctIndex].style.background = '#0be881';
    btns[currentQuestion.correctIndex].style.color = '#fff';
    addHistory(false, true);
    const newlyUnlocked = checkTitleUnlocks();

    saveData();
    sendRankingData();

    setTimeout(() => { 
      updateHomeUI(); 
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); 
      document.getElementById('home-screen').classList.add('active'); 
      if (newlyUnlocked.length > 0) showTitleModal(newlyUnlocked);
    }, 2000);
  }

  // --- 履歴処理 ---
  function addHistory(isCorrect, isTimeout = false) {
    let resultText = isCorrect ? "🌟 正解！" : (isTimeout ? "⏳ タイムアップ" : "💧 ザンネン...");
    let ptText = isCorrect ? `(+${currentQuestion.level}pt)` : "";
    let className = isCorrect ? "correct" : "incorrect";
    const historyStr = `<div class="history-item ${className}">
      <span style="font-size:12px; color:#a4b0be;">[Lv${currentQuestion.level}] ${currentQuestion.genre}</span><br>
      ${resultText} ${ptText}
    </div>`;
    appData.history.unshift(historyStr);
    if(appData.history.length > 50) appData.history.pop();
    renderHistory();
  }

  function renderHistory() { 
    const hl = document.getElementById('history-list');
    if(hl) hl.innerHTML = appData.history.join('');
  }

  // --- 称号システム ---
  function checkTitleUnlocks() {
    let newlyUnlocked = [];
    if(titlesData.length === 0) return newlyUnlocked;

    titlesData.forEach(t => {
      if (!appData.unlockedTitles.includes(t.id)) {
        if (t.check(appData)) { 
          appData.unlockedTitles.push(t.id); 
          newlyUnlocked.push(t);
        }
      }
    });
    if(newlyUnlocked.length > 0) saveData();
    return newlyUnlocked;
  }

  function showTitleModal(titles) {
    playCorrectSound();
    const container = document.getElementById('unlocked-titles-container');
    container.innerHTML = titles.map(t => `
      <div class="new-title-item">
        <div class="new-title-label">NEW TITLE!!</div>
        <div class="new-title-name">[${t.type}] ${t.title}</div>
        <div class="new-title-desc">${t.condition_desc}</div>
      </div>
    `).join('');
    document.getElementById('title-unlock-modal').classList.add('active');
  }

  function closeTitleModal() {
    playClick(); document.getElementById('title-unlock-modal').classList.remove('active');
  }

  function showTitleScreen() {
    playClick(); renderTitleList();
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('title-screen').classList.add('active');
  }

  function renderTitleList() {
    const list = document.getElementById('title-list');
    if (titlesData.length === 0) {
      list.innerHTML = '<div style="text-align:center; padding: 20px; color: #808e9b; font-weight: bold;">称号データは現在準備中です！<br>もうしばらくお待ちください。</div>';
      return;
    }

    let html = '';
    titlesData.forEach(t => {
      const isUnlocked = appData.unlockedTitles.includes(t.id);
      const isCurrent = appData.currentTitleId === t.id;
      if (isUnlocked) {
        html += `
          <div class="title-item">
            <div class="title-info">
              <div class="title-name">[${t.type}] ${t.title}</div>
              <div class="title-desc">${t.condition_desc}</div>
            </div>
            <button class="title-btn ${isCurrent ? 'current' : ''}" ${isCurrent ? 'disabled' : ''} onclick="setCurrentTitle(${t.id})">
              ${isCurrent ? 'セット中' : 'セットする'}
            </button>
          </div>`;
      } else {
        html += `
          <div class="title-item locked">
            <div class="title-info">
              <div class="title-name">🔒 ？？？</div>
              <div class="title-desc">解放条件: ${t.condition_desc}</div>
            </div>
            <button class="title-btn" disabled>未獲得</button>
          </div>`;
      }
    });
    list.innerHTML = html;
  }

  function setCurrentTitle(id) {
    playClick(); appData.currentTitleId = id; saveData();
    updateHomeUI(); renderTitleList();
  }

  window.onload = async () => {
    await loadGameData();
  };
</script>
