<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アニマス - スマホ画面</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* 全体の超ポップなテーマ設定 */
  :root {
    --primary: #ff4757;
    --secondary: #ff6b81;
    --accent: #ffa502;
    --bg-color: #fffdf5;
    --text-main: #2f3542;
    --white: #ffffff;
    --border-color: #2f3542;
  }

  body {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    background-color: #ffcccc;
    background-image: radial-gradient(#ff9999 15%, transparent 16%), radial-gradient(#ff9999 15%, transparent 16%);
    background-size: 30px 30px;
    background-position: 0 0, 15px 15px;
    color: var(--text-main);
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-weight: 900;
  }

  #app {
    width: 100%;
    max-width: 400px;
    background-color: var(--bg-color);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    border-left: 4px solid var(--border-color);
    border-right: 4px solid var(--border-color);
    display: flex;
    flex-direction: column;
  }
  @media (min-width: 401px) {
    #app { 
      min-height: 800px;
      height: 95vh; 
      border-radius: 24px; 
      border: 6px solid var(--border-color); 
      box-shadow: 8px 8px 0px rgba(0,0,0,0.15);
    }
  }

  /* 画面切り替えアニメーション */
  .screen { display: none; padding: 10px; box-sizing: border-box; height: 100%; overflow-y: auto; flex-direction: column; }
  .screen.active { display: flex; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  @keyframes popIn { 
    from { opacity: 0; transform: scale(0.9) translateY(20px); } 
    to { opacity: 1; transform: scale(1) translateY(0); } 
  }

  /* ホーム画面はスクロール無効化し全体を綺麗に1画面に収める */
  #home-screen {
    overflow-y: hidden;
    justify-content: space-between;
  }

  /* ロゴのアニメーション設定 */
  .title-logo {
    font-size: 45px; color: #fff; font-weight: 900; line-height: 1.2; text-align: center;
    text-shadow: 4px 4px 0 var(--border-color), -2px -2px 0 var(--border-color), 2px -2px 0 var(--border-color), -2px 2px 0 var(--border-color);
    margin-top: 10px; margin-bottom: 20px;
    transform: rotate(-3deg);
    animation: bounceLogo 2s infinite ease-in-out;
  }
  @keyframes bounceLogo {
    0%, 100% { transform: rotate(-3deg) scale(1); }
    50% { transform: rotate(-3deg) scale(1.05); }
  }

  /* 共通ヘッダー */
  .header {
    background: repeating-linear-gradient(-45deg, #ff4757, #ff4757 15px, #ff6b81 15px, #ff6b81 30px);
    color: var(--white); text-align: center; padding: 10px; border-radius: 12px; margin-bottom: 12px;
    font-weight: 900; font-size: 20px; border: 3px solid var(--border-color);
    box-shadow: 4px 4px 0px var(--border-color);
    text-shadow: 2px 2px 0 var(--border-color), -2px -2px 0 var(--border-color), 2px -2px 0 var(--border-color), -2px 2px 0 var(--border-color);
    letter-spacing: 2px;
  }
  
  /* ホーム画面のアニマス名表示 */
  .animas-name {
    text-align: center; padding: 6px;
    background-color: #ffd32a;
    border-radius: 15px; border: 3px solid var(--border-color); box-shadow: 4px 4px 0px var(--border-color);
    margin-bottom: 6px; font-size: 13px; color: var(--border-color);
  }
  #animas-title {
    font-size: 22px; color: #ff3f34; display: block; margin-top: 2px; text-shadow: 2px 2px 0 var(--white);
  }

  /* ステータスバー（ライフ・問題数・獲得pt・正解率） */
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #0be881;
    padding: 6px 12px; border-radius: 12px;
    border: 3px solid var(--border-color); box-shadow: 4px 4px 0px var(--border-color);
    margin-bottom: 6px; font-weight: 900;
  }
  .life-area { text-align: right; }
  .life-icons { letter-spacing: 2px; text-shadow: 1px 1px 0px var(--border-color); }
  #life-timer { font-size: 11px; color: var(--text-main); background: var(--white); padding: 4px 10px; border-radius: 10px; display: inline-block; margin-top: 4px; border: 2px solid var(--border-color); font-weight: 900;}

  /* レーダーチャートの囲み（パラメータ拡大＆中央配置） */
  .chart-container {
    background: transparent; border: none; box-shadow: none;
    padding: 0px; margin: 6px 0; flex-grow: 1; 
    display: flex; align-items: center; justify-content: center;
  }
  canvas { width: 100% !important; max-height: 330px !important; }

  /* アクションボタン */
  .action-btn {
    width: 100%; padding: 12px; border: 3px solid var(--border-color) !important; border-radius: 15px;
    background: linear-gradient(135deg, #ff9ff3 0%, #feca57 100%) !important; color: #fff !important; font-size: 18px; font-weight: 900; margin-bottom: 6px; cursor: pointer; box-shadow: 0 4px 0px var(--border-color); transition: transform 0.1s, box-shadow 0.1s; text-shadow: 2px 2px 0 var(--border-color); font-family: 'M PLUS Rounded 1c', sans-serif;
  }
  .action-btn:active { transform: translateY(4px); box-shadow: 0 0px 0 var(--border-color); }
  .action-btn:disabled { background: #d2dae2 !important; box-shadow: 0 4px 0 #808e9b !important; border-color: #808e9b !important; text-shadow: none !important; cursor: not-allowed; transform: none; }

  /* モード選択のデータ表示用 */
  .mode-info-box {
    font-size: 14px; color: #fff; text-shadow: none; margin-top: 10px;
    background: rgba(0, 0, 0, 0.2); padding: 8px; border-radius: 10px; line-height: 1.4;
  }
  .info-highlight { color: #ffd32a; font-size: 18px; text-shadow: 1px 1px 0 #2f3542; }

  /* サブボタン */
  .share-area, .history-link { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
  .share-area button, .history-link button {
    flex: 1; padding: 6px 4px; border: 3px solid var(--border-color); border-radius: 10px; font-weight: 900;
    cursor: pointer; transition: all 0.1s; font-size: 13px; box-shadow: 0 3px 0px var(--border-color);
  }
  .share-area button { background: #fff; color: var(--text-main); }
  .history-link button { background-color: #d2dae2; color: var(--text-main); font-size: 12px; }
  .share-area button:active, .history-link button:active { transform: translateY(3px); box-shadow: 0 0px 0 var(--border-color); }

  /* ランキングタブ */
  .ranking-tabs { display: flex; gap: 5px; margin-bottom: 10px; }
  .ranking-tab { flex: 1; padding: 10px; text-align: center; font-weight: 900; font-size: 14px; border: 3px solid var(--border-color); border-radius: 10px; background: #fff; cursor: pointer; transition: 0.2s; box-shadow: 0 3px 0 var(--border-color); }
  .ranking-tab:active { transform: translateY(3px); box-shadow: 0 0 0 var(--border-color); }
  .ranking-tab.active-tab { background: #4bcffa; color: #fff; text-shadow: 1px 1px 0 var(--border-color); }

  /* クイズ・リスト画面要素 */
  .quiz-info { background: #ef5777; color: #fff; text-shadow: 1px 1px 0 var(--border-color); border: 3px solid var(--border-color); padding: 10px; text-align: center; border-radius: 12px; box-shadow: 4px 4px 0px var(--border-color); margin-bottom: 15px; font-weight: 900; font-size: 15px; }
  .timer-bar { width: 100%; height: 16px; background-color: #fff; border-radius: 8px; border: 3px solid var(--border-color); margin-bottom: 15px; overflow: hidden; box-shadow: 4px 4px 0px var(--border-color); }
  .timer-fill { height: 100%; background: linear-gradient(90deg, #ff3f34 0%, #ffbe76 100%); width: 100%; transition: width 1s linear; }
  .question-area { background: #ffffff; color: var(--text-main); text-shadow: none; min-height: 100px; padding: 15px; border-radius: 15px; border: 3px solid var(--border-color); margin-bottom: 15px; display: flex; align-items: center; justify-content: center; font-size: 17px; text-align: center; font-weight: 900; line-height: 1.5; box-shadow: 4px 4px 0px var(--border-color); flex-grow: 1; }
  .choice-btn { width: 100%; padding: 14px; margin-bottom: 10px; border: 3px solid var(--border-color); background-color: #fff; cursor: pointer; font-size: 15px; text-align: center; border-radius: 12px; font-weight: 900; color: var(--text-main); box-shadow: 0 4px 0px var(--border-color); transition: transform 0.1s, background 0.2s; font-family: 'M PLUS Rounded 1c', sans-serif; }
  .choice-btn:active { transform: translateY(4px); box-shadow: 0 0px 0 var(--border-color); background-color: #f1f2f6; }
  
  .custom-list, .stats-container { background: var(--white); overflow-y: auto; margin-bottom: 15px; flex-grow: 1; padding: 15px; border-radius: 15px; border: 3px solid var(--border-color); box-shadow: 4px 4px 0px var(--border-color); font-size: 14px; font-weight: 900; }
  .custom-list::-webkit-scrollbar, .stats-container::-webkit-scrollbar { width: 8px; }
  .custom-list::-webkit-scrollbar-thumb, .stats-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
  .stats-section { margin-bottom: 15px; }
  .stats-section-title { color: var(--white); background: #3c40c6; display: inline-block; padding: 4px 10px; border-radius: 8px; margin-bottom: 10px; border: 2px solid var(--border-color); font-size: 15px;}
  .stats-row { display: flex; justify-content: space-between; padding: 6px 0; color: var(--text-main); border-bottom: 2px dashed #d2dae2; }
  .history-item { padding: 12px 10px; border-bottom: 3px dashed #d2dae2; font-weight: 900; }
  .history-item.correct { color: #05c46b; }
  .history-item.incorrect { color: #ff3f34; }

  /* 称号アイテム */
  .title-item { border: 3px solid var(--border-color); padding: 12px; display: flex; justify-content: space-between; align-items: center; background-color: #fff; margin-bottom: 12px; border-radius: 12px; box-shadow: 2px 2px 0px var(--border-color); }
  .title-item.locked { background: #d2dae2; box-shadow: none; border-color: #808e9b; color: #808e9b;}
  .title-info { flex: 1; margin-right: 10px; }
  .title-name { font-weight: 900; font-size: 15px; margin-bottom: 4px; color: #3c40c6; }
  .title-item.locked .title-name { color: #808e9b; }
  .title-desc { font-size: 12px; color: #575fcf; font-weight: 900; }
  .title-item.locked .title-desc { color: #808e9b; }
  .title-btn { padding: 8px 12px; background: #0fb9b1; border: 3px solid var(--border-color); color: #fff; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: 900; box-shadow: 0 3px 0px var(--border-color); transition: all 0.1s; text-shadow: 1px 1px 0 var(--border-color); }
  .title-btn:active { transform: translateY(3px); box-shadow: 0 0px 0 var(--border-color); }
  .title-btn.current { background: #ffdd59; color: var(--text-main); text-shadow: none; }
  .title-btn:disabled { background: #808e9b; color: #d2dae2; border-color: #808e9b; box-shadow: none; cursor: not-allowed; transform: none; text-shadow: none;}
</style>
</head>
<body>

<div id="app">

  <div id="mode-select-screen" class="screen active">
    <div class="title-logo">🌟 アニマス 🌟<br>QUIZ</div>
    <div class="header" style="margin-bottom: 20px;">🎮 モード選択</div>
    
    <div style="text-align: center; font-size: 18px; font-weight: 900; margin-bottom: 15px; color: var(--text-main);">
      👤 <span id="top-player-name" style="color: var(--primary);">ゲスト</span> さん
      <span onclick="openNameEditModal()" style="cursor: pointer; font-size: 16px; margin-left: 5px; padding: 5px; background: #fff; border-radius: 50%; border: 2px solid var(--border-color); box-shadow: 2px 2px 0 var(--border-color);">✏️</span>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px; padding-bottom: 20px;">
      <button class="action-btn" style="padding: 15px; font-size: 22px;" onclick="goToHome()">
        分野別モード
        <div class="mode-info-box" id="genre-info-text">データ読み込み中...</div>
      </button>
      <button class="action-btn" style="padding: 15px; font-size: 22px;" onclick="window.location.href='generation/generation.html'">
        世代別モード
        <div class="mode-info-box" id="gen-info-text">データ読み込み中...</div>
      </button>
      <button class="action-btn" style="padding: 15px; font-size: 22px;" onclick="window.location.href='onepiece/onepiece.html'">
        ワンピースモード
        <div class="mode-info-box" id="onepiece-info-text">データ読み込み中...</div>
      </button>
    </div>
  </div>

  <div id="home-screen" class="screen">
    <div class="animas-name">あなたのアニマス名<br><strong id="animas-title">見習いウォッチャー</strong></div>
    
    <div class="status-bar">
      <div>
        <div style="font-size:14px;">総回答数 <span id="total-answers" style="color:#ff3f34; font-size:18px; text-shadow: 1px 1px 0 #fff;">0</span> 問</div>
        <div style="font-size:12px; margin-top:2px; color:var(--text-main);">総獲得pt <span id="total-points" style="color:#ffa502; font-size:16px; text-shadow: 1px 1px 0 #fff;">0</span> pt</div>
        <div style="font-size:12px; margin-top:2px; color:var(--text-main);">正解率 <span id="correct-rate" style="color:#0be881; font-size:16px; text-shadow: 1px 1px 0 #fff;">0</span> %</div>
      </div>
      <div class="life-area">
        <div class="life-icons" id="life-icons">💙💙💙💙💙</div>
        <div id="life-timer">MAX</div>
      </div>
    </div>

    <div class="chart-container"><canvas id="radarChart"></canvas></div>

    <button class="action-btn" id="start-btn" onclick="startQuiz()" disabled>データ読み込み中...</button>
    
    <button id="ad-recover-btn" class="action-btn" style="display: none; background: linear-gradient(135deg, #2ed573 0%, #7bed9f 100%) !important; margin-bottom: 6px;" onclick="watchAdToRecover()">
      📺 広告を見てライフ全回復！
    </button>

    <div class="share-area">
      <button onclick="shareResult('copy')">📋 コピー</button>
      <button onclick="shareResult('line')" style="color:#05c46b;">💬 LINE</button>
      <button onclick="shareResult('x')" style="color:var(--text-main);">𝕏 Post</button>
    </div>
    
    <div class="history-link">
      <button onclick="showTitleScreen()">🏆 称号</button>
      <button onclick="showRankingScreen()" style="background:#ff9ff3; color:#fff; text-shadow:1px 1px 0 var(--border-color);">👑 ﾗﾝｷﾝｸﾞ</button>
      <button onclick="showScreen('history-screen')">📊 データ</button>
    </div>
    
    <button class="action-btn" style="margin-top: 4px; padding: 8px; font-size: 15px; background: linear-gradient(135deg, #d2dae2 0%, #a4b0be 100%) !important; color: #2f3542 !important; text-shadow: 1px 1px 0 #fff !important; border-color: #808e9b !important; box-shadow: 0 3px 0px #808e9b !important; margin-bottom: 0;" onclick="goToModeSelect()">⬅️ モード選択に戻る</button>
  </div>

  <div id="quiz-screen" class="screen">
    <div class="header">🌟 アニマス 🌟 <span style="float:right; font-size:14px; margin-top:2px;" id="quiz-level-display">Lv1</span></div>
    <div class="quiz-info" id="quiz-genre">出題アニメ名 / ジャンル</div>
    <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
    <div class="question-area" id="quiz-text">問題文</div>
    <div id="choices-area"></div>
  </div>

  <div id="history-screen" class="screen">
    <div class="header">📊 データ</div>
    <div class="stats-container" id="stats-area"></div>
    <button class="action-btn" onclick="showScreen('home-screen')">🏠 ホームに戻る</button>
  </div>

  <div id="title-screen" class="screen">
    <div class="header">🏆 称号コレクション</div>
    <div class="custom-list" id="title-list"></div>
    <button class="action-btn" onclick="showScreen('home-screen')">🏠 ホームに戻る</button>
  </div>

  <div id="ranking-screen" class="screen">
    <div class="header">👑 ランキング</div>
    
    <div class="ranking-tabs">
      <div id="ranking-tab-point" class="ranking-tab active-tab" onclick="loadRankingData('point')">総合ポイント</div>
      <div id="ranking-tab-rate" class="ranking-tab" onclick="loadRankingData('rate')">正解率</div>
    </div>
    
    <div class="custom-list" id="ranking-list-area" style="padding: 10px;"></div>

    <button class="action-btn" onclick="showScreen('home-screen')">🏠 ホームに戻る</button>
  </div>
  
  <div id="title-unlock-modal" class="modal-overlay">
    <div class="modal-content">
      <h2 class="modal-title">🎉 新称号 獲得!! 🎉</h2>
      <div id="unlocked-titles-container"></div>
      <button class="action-btn" style="margin-bottom:0;" onclick="closeTitleModal()">OK!</button>
    </div>
  </div>

  <div id="name-modal" class="modal-overlay">
    <div class="modal-content" style="background: #fff;">
      <h2 class="modal-title" style="font-size: 20px; animation: none;">プレイヤー名設定</h2>
      <p style="font-size: 13px; color: #808e9b; margin-bottom: 15px; font-weight: 900;">
        ランキングに表示される名前です。<br>全モードで共通して使用されます。
      </p>
      <input type="text" id="player-name-input" placeholder="10文字以内で入力" maxlength="10" style="width: 90%; padding: 12px; font-size: 16px; margin-bottom: 5px; border: 3px solid var(--border-color); border-radius: 10px; font-weight: 900; font-family: 'M PLUS Rounded 1c', sans-serif;">
      <div id="name-error" style="color: #ff4757; font-size: 12px; font-weight: 900; min-height: 18px; margin-bottom: 10px;"></div>
      <button class="action-btn" style="margin-bottom:0;" onclick="savePlayerName()">決定</button>
    </div>
  </div>

</div>

<script>
  // --- 効果音システム (Web Audio API) ---
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let audioCtx;

  function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playTone(freq, type, duration, vol=0.1) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
  }
  function playClick() { initAudio(); playTone(800, 'sine', 0.05, 0.05); }
  function playCorrectSound() { initAudio(); playTone(523.25, 'sine', 0.1, 0.1); setTimeout(() => playTone(659.25, 'sine', 0.1, 0.1), 100); setTimeout(() => playTone(783.99, 'sine', 0.3, 0.1), 200); }
  function playIncorrectSound() { initAudio(); playTone(200, 'sawtooth', 0.2, 0.1); setTimeout(() => playTone(150, 'sawtooth', 0.4, 0.1), 150); }

  // --- 全体共通変数 ---
  let questionsData = [];
  let titlesData = [];
  let isDataLoaded = false;
  let playerName = localStorage.getItem('animasPlayerName') || '';

  // --- 非同期データ読み込み ---
  async function loadGameData() {
    try {
      const qRes = await fetch('questions.json');
      if (!qRes.ok) throw new Error('questions.json が見つかりません');
      questionsData = await qRes.json();

      const uniqueAnimes = new Set(questionsData.map(q => q.anime)).size;
      const totalQuestions = questionsData.length;
      document.getElementById('genre-info-text').innerHTML = `📺 収録アニメ: <span class="info-highlight">${uniqueAnimes}</span> 作品<br>📝 総問題数: <span class="info-highlight">${totalQuestions}</span> 問`;

      try {
        const gRes = await fetch('generation/generation.json');
        if (gRes.ok) {
          const gText = await gRes.text();
          const genData = JSON.parse(gText);
          const gUniqueAnimes = new Set(genData.map(q => q["アニメ名"] || q.anime)).size;
          document.getElementById('gen-info-text').innerHTML = `📺 収録アニメ: <span class="info-highlight">${gUniqueAnimes}</span> 作品<br>📝 総問題数: <span class="info-highlight">${genData.length}</span> 問`;
        } else { document.getElementById('gen-info-text').innerHTML = `📺 収録アニメ: 準備中<br>📝 総問題数: 準備中`; }
      } catch (e) { document.getElementById('gen-info-text').innerHTML = `📺 収録アニメ: 準備中<br>📝 総問題数: 準備中`; }

      try {
        const oRes = await fetch('onepiece/onepiece.json');
        if (oRes.ok) {
          const oText = await oRes.text();
          const onePieceData = JSON.parse(oText);
          const oUniqueAnimes = new Set(onePieceData.map(q => q["アニメ名"] || q.anime)).size;
          document.getElementById('onepiece-info-text').innerHTML = `📺 収録アニメ: <span class="info-highlight">${oUniqueAnimes}</span> 作品<br>📝 総問題数: <span class="info-highlight">${onePieceData.length}</span> 問`;
        } else { document.getElementById('onepiece-info-text').innerHTML = `📺 収録アニメ: 準備中<br>📝 総問題数: 準備中`; }
      } catch (e) { document.getElementById('onepiece-info-text').innerHTML = `📺 収録アニメ: 準備中<br>📝 総問題数: 準備中`; }

      const tRes = await fetch('titles.json');
      if (tRes.ok) {
        const rawTitles = await tRes.json();
        titlesData = rawTitles.map(t => {
          t.check = function(d) {
            const earned = d.stats.action + d.stats.fantasy + d.stats.scifi + d.stats.sliceOfLife + d.stats.romance;
            const maxVal = Math.max(d.stats.action, d.stats.fantasy, d.stats.scifi, d.stats.sliceOfLife, d.stats.romance);
            if (t.id === 1) return true;
            if (t.id >= 2 && t.id <= 10) return earned >= [0, 10, 50, 100, 300, 500, 1000, 2000, 5000, 10000][t.id - 1];
            if (t.id >= 11 && t.id <= 60) {
              const typeMap = {1: 'action', 2: 'fantasy', 3: 'scifi', 4: 'sliceOfLife', 5: 'romance'};
              const statName = typeMap[Math.floor((t.id - 11) / 10) + 1];
              const idx = (t.id - 1) % 10; 
              if (idx < 9) return (d.stats[statName]) >= [20, 50, 100, 200, 300, 500, 1000, 2000, 5000][idx] && maxVal === d.stats[statName];
              else return earned > 0 && (d.stats[statName]) / earned >= 0.8;
            }
            if (t.id >= 61 && t.id <= 80) {
              const s = [d.stats.action, d.stats.fantasy, d.stats.scifi, d.stats.sliceOfLife, d.stats.romance].sort((a,b)=>b-a);
              return (s[0]) >= ((t.id % 2 !== 0) ? 50 : 300) && (s[1]) >= ((t.id % 2 !== 0) ? 50 : 300) && (s[0] - s[1]) <= 20;
            }
            if (t.id >= 81 && t.id <= 84) return Math.min(d.stats.action, d.stats.fantasy, d.stats.scifi, d.stats.sliceOfLife, d.stats.romance) >= [50, 100, 300, 1000][t.id - 81];
            if (t.id >= 92 && t.id <= 94) return d.totalAnswers >= [100, 500, 1000][t.id - 92];
            if (t.id === 95) return d.answeredQuestions.length >= 100;
            return false; 
          };
          return t;
        });
      }

      document.getElementById('start-btn').innerText = "▶ クイズに挑戦！";
      document.getElementById('start-btn').disabled = false;
      isDataLoaded = true;
      init();
    } catch (error) {
      console.error("データの読み込みに失敗しました:", error);
    }
  }

  // --- ライフ回復ロジック ---
  function checkLifeRecovery() {
    const RECOVERY_MS = 10 * 60 * 1000;
    if (appData.life >= 5) {
      appData.lastLifeTime = Date.now();
      document.getElementById('life-timer').innerText = "MAX";
      saveData(); return;
    }
    const diff = Date.now() - appData.lastLifeTime;
    if (diff >= RECOVERY_MS) {
      const recovered = Math.floor(diff / RECOVERY_MS);
      appData.life = Math.min(5, appData.life + recovered);
      appData.lastLifeTime += recovered * RECOVERY_MS;
      saveData(); updateHomeUI();
    } else {
      const remainMs = RECOVERY_MS - diff;
      const remainMin = Math.floor(remainMs / (60 * 1000));
      const remainSec = Math.floor((remainMs % (60 * 1000)) / 1000);
      document.getElementById('life-timer').innerText = `あと ${String(remainMin).padStart(2, '0')}:${String(remainSec).padStart(2, '0')}`;
    }
  }

  // --- クイズ開始（全レベルから完全にランダムで出題） ---
  function startQuiz() {
    playClick();
    if (appData.life <= 0) { alert("ライフが回復するまでお待ちください！"); return; }
    
    // レベルによる制限をなくし、未クリア（未回答）の問題から選出
    const available = questionsData.filter(q => !appData.answeredQuestions.includes(q.id));
    if (available.length === 0) { alert("すべてのクイズをクリアしました！クリアおめでとうございます！"); return; }

    appData.life--; saveData(); updateHomeUI();
    currentQuestion = available[Math.floor(Math.random() * available.length)];
    
    // 選択肢のシャッフル処理
    let correctText = currentQuestion.choices[currentQuestion.correctIndex];
    for (let i = currentQuestion.choices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [currentQuestion.choices[i], currentQuestion.choices[j]] = [currentQuestion.choices[j], currentQuestion.choices[i]];
    }
    currentQuestion.correctIndex = currentQuestion.choices.indexOf(correctText);

    // ヘッダーに出題問題の元のレベルを表示
    document.getElementById('quiz-level-display').innerText = `Lv${currentQuestion.level}`;
    document.getElementById('quiz-genre').innerText = `【 ${currentQuestion.anime} 】\n${currentQuestion.genre}`;
    document.getElementById('quiz-text').innerText = currentQuestion.text;
    
    const choicesArea = document.getElementById('choices-area');
    choicesArea.innerHTML = '';
    currentQuestion.choices.forEach((choice, index) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn'; btn.innerText = choice;
      btn.onclick = () => handleAnswer(index, btn);
      choicesArea.appendChild(btn);
    });
    isAnswering = true; timeLeft = 10;
    const timerFill = document.getElementById('timer-fill');
    timerFill.style.transition = 'none'; timerFill.style.width = '100%';
    setTimeout(() => { timerFill.style.transition = 'width 1s linear'; }, 50);
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('quiz-screen').classList.add('active');
    
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--; timerFill.style.width = `${(timeLeft / 10) * 100}%`;
      if (timeLeft <= 0) { 
        clearInterval(timerInterval); 
        setTimeout(() => { if (isAnswering) handleTimeout(); }, 1000);
      }
    }, 1000);
  }

  // --- 統計 ---
  function recordStatistics(q, isCorrect) {
    if (!appData.statistics) appData.statistics = { anime: {}, genre: {}, level: {} };
    const s = appData.statistics;
    if (!s.anime[q.anime]) s.anime[q.anime] = { total: 0, correct: 0 };
    s.anime[q.anime].total++; if (isCorrect) s.anime[q.anime].correct++;
    if (!s.genre[q.genre]) s.genre[q.genre] = { total: 0, correct: 0 };
    s.genre[q.genre].total++; if (isCorrect) s.genre[q.genre].correct++;
    if (!s.level[q.level]) s.level[q.level] = { total: 0, correct: 0 };
    s.level[q.level].total++; if (isCorrect) s.level[q.level].correct++;
  }

  function renderStatistics() {
    if (!appData.statistics) appData.statistics = { anime: {}, genre: {}, level: {} };
    const s = appData.statistics;
    let html = '';
    const makeSection = (title, dataObj, keyPrefix) => {
      let secHtml = `<div class="stats-section"><div class="stats-section-title">${title}</div>`;
      const keys = Object.keys(dataObj);
      if (keys.length === 0) {
        secHtml += `<div style="color:#999; font-size:12px;">データがありません</div>`;
      } else {
        keys.sort((a, b) => dataObj[b].total - dataObj[a].total).forEach(k => {
          const d = dataObj[k];
          const rate = d.total > 0 ? Math.round((d.correct / d.total) * 100) : 0;
          secHtml += `<div class="stats-row"><span>${keyPrefix}${k}</span><span>${d.correct}/${d.total}問 (${rate}%)</span></div>`;
        });
      }
      secHtml += `</div>`;
      return secHtml;
    };
    html += makeSection('📌 アニメ別', s.anime, '');
    html += makeSection('📌 ジャンル別', s.genre, '');
    html += makeSection('📌 レレベル別', s.level, 'Lv ');
    document.getElementById('stats-area').innerHTML = html;
  }

  // --- 回答処理 ---
  function handleAnswer(selectedIndex, btnElement) {
    if (!isAnswering) return;
    isAnswering = false; clearInterval(timerInterval);
    appData.totalAnswers++;
    const isCorrect = (selectedIndex === currentQuestion.correctIndex);
    const btns = document.querySelectorAll('.choice-btn');

    recordStatistics(currentQuestion, isCorrect);
    if (isCorrect) {
      playCorrectSound();
      appData.totalCorrects++;
      btnElement.style.background = '#0be881'; btnElement.style.color = '#fff';
      const pt = currentQuestion.level; // レベルの値がそのままポイントになる
      if(currentQuestion.genre === "アクション") appData.stats.action += pt;
      if(currentQuestion.genre === "ファンタジー") appData.stats.fantasy += pt;
      if(currentQuestion.genre === "SF") appData.stats.scifi += pt;
      if(currentQuestion.genre === "日常") appData.stats.sliceOfLife += pt;
      if(currentQuestion.genre === "恋愛") appData.stats.romance += pt;
      
      appData.answeredQuestions.push(currentQuestion.id);
      addHistory(true); 
      const newlyUnlocked = checkTitleUnlocks();
      saveData();
      sendRankingData();
      
      setTimeout(() => { 
        updateHomeUI(); document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); 
        document.getElementById('home-screen').classList.add('active'); 
        if (newlyUnlocked.length > 0) showTitleModal(newlyUnlocked);
      }, 1200);
    } else {
      playIncorrectSound();
      btnElement.style.background = '#ff3f34'; btnElement.style.color = '#fff';
      btns[currentQuestion.correctIndex].style.background = '#0be881';
      btns[currentQuestion.correctIndex].style.color = '#fff';
      addHistory(false); 
      const newlyUnlocked = checkTitleUnlocks();
      saveData();
      sendRankingData();

      setTimeout(() => { 
        updateHomeUI(); document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); 
        document.getElementById('home-screen').classList.add('active'); 
        if (newlyUnlocked.length > 0) showTitleModal(newlyUnlocked);
      }, 2000);
    }
  }

  function handleTimeout() {
    if (!isAnswering) return;
    isAnswering = false; appData.totalAnswers++;
    playIncorrectSound(); recordStatistics(currentQuestion, false); 
    const btns = document.querySelectorAll('.choice-btn');
    btns[currentQuestion.correctIndex].style.background = '#0be881';
    btns[currentQuestion.correctIndex].style.color = '#fff';
    addHistory(false, true);
    const newlyUnlocked = checkTitleUnlocks();
    saveData();
    sendRankingData();

    setTimeout(() => {

      document.getElementById('home-screen').classList.add('active');

    }, 2000);
  }

      <span style="font-size:12px; color:#a4b0be;">[Lv${currentQuestion.level}] ${currentQuestion.anime}</span><br>
      ${resultText} ${ptText}

    appData.history.unshift(historyStr);
    if(appData.history.length > 50) appData.history.pop();
    const hl = document.getElementById('history-list');
    if(hl) hl.innerHTML = appData.history.join('');
  }

    let html = '';
    titlesData.forEach(t => {
      const isUnlocked = appData.unlockedTitles.includes(t.id);
      const isCurrent = appData.currentTitleId === t.id;
      if (isUnlocked) {
        html += `<div class="title-item"><div class="title-info"><div class="title-name">[${t.type}] ${t.title}</div><div class="title-desc">${t.condition_desc}</div></div><button class="title-btn ${isCurrent ? 'current' : ''}" ${isCurrent ? 'disabled' : ''} onclick="setCurrentTitle(${t.id})">${isCurrent ? 'セット中' : 'セットする'}</button></div>`;
      } else {
        html += `<div class="title-item locked"><div class="title-info"><div class="title-name">🔒 ？？？</div><div class="title-desc">解放条件: ${t.condition_desc}</div></div><button class="title-btn" disabled>未獲得</button></div>`;
      }
    });
    list.innerHTML = html;
  }

  function setCurrentTitle(id) {
    playClick(); appData.currentTitleId = id; saveData(); updateHomeUI(); renderTitleList();
  }

  // --- 初期起動処理 ---
  window.onload = async () => {
    UX();
    await loadGameData();
    updatePlayerNameDisplay();
  };
</script>
</body>
</html>
