<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アニマス - スマホ画面</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* 全体の超ポップなテーマ設定 */
  :root {
    --primary: #ff4757; /* ビビッドな赤 */
    --secondary: #ff6b81;
    --accent: #ffa502;
    --bg-color: #fffdf5;
    --text-main: #2f3542; /* 太い枠線・文字用の黒寄りの色 */
    --white: #ffffff;
    --border-color: #2f3542; 
  }

  body {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    /* ポップなドット背景 */
    background-color: #ffcccc;
    background-image: radial-gradient(#ff9999 15%, transparent 16%), radial-gradient(#ff9999 15%, transparent 16%);
    background-size: 30px 30px;
    background-position: 0 0, 15px 15px;
    color: var(--text-main);
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-weight: 900; /* 全体を極太フォントに */
  }

  #app {
    width: 100%;
    max-width: 400px;
    background-color: var(--bg-color);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    /* コミック風の太枠 */
    border-left: 4px solid var(--border-color);
    border-right: 4px solid var(--border-color);
  }
  @media (min-width: 401px) {
    #app { 
      min-height: 850px; height: 95vh; 
      border-radius: 24px; 
      overflow: hidden; 
      border: 6px solid var(--border-color); 
      box-shadow: 8px 8px 0px rgba(0,0,0,0.15);
    }
  }

  /* 画面切り替えのポップなアニメーション */
  .screen { display: none; padding: 20px; box-sizing: border-box; height: 100%; overflow-y: auto; }
  .screen.active { display: block; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  @keyframes popIn { 
    from { opacity: 0; transform: scale(0.9) translateY(20px); } 
    to { opacity: 1; transform: scale(1) translateY(0); } 
  }

  /* ヘッダー（超派手な斜めストライプ） */
  .header {
    background: repeating-linear-gradient(
      -45deg,
      #ff4757,
      #ff4757 15px,
      #ff6b81 15px,
      #ff6b81 30px
    );
    color: var(--white);
    text-align: center;
    padding: 15px 10px;
    border-radius: 12px;
    margin-bottom: 20px;
    font-weight: 900;
    font-size: 22px;
    border: 3px solid var(--border-color);
    box-shadow: 4px 4px 0px var(--border-color);
    text-shadow: 2px 2px 0 var(--border-color), -2px -2px 0 var(--border-color), 2px -2px 0 var(--border-color), -2px 2px 0 var(--border-color);
    letter-spacing: 2px;
  }
  
  /* ホーム画面のアニマス名表示 */
  .animas-name {
    text-align: center;
    padding: 20px;
    background-color: #ffd32a; /* 派手なイエロー */
    border-radius: 15px;
    border: 3px solid var(--border-color);
    box-shadow: 4px 4px 0px var(--border-color);
    margin-bottom: 20px;
    font-size: 16px;
    color: var(--border-color);
  }
  #animas-title {
    font-size: 26px;
    color: #ff3f34;
    display: block;
    margin-top: 5px;
    text-shadow: 2px 2px 0 var(--white);
  }

  /* ステータスバー（ライフ・問題数） */
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #0be881; /* ミントグリーン */
    padding: 12px 15px; border-radius: 12px;
    border: 3px solid var(--border-color);
    box-shadow: 4px 4px 0px var(--border-color);
    margin-bottom: 20px; font-weight: 900;
  }
  .life-area { text-align: right; }
  .life-icons { letter-spacing: 2px; text-shadow: 1px 1px 0px var(--border-color); }
  #life-timer { font-size: 12px; color: var(--text-main); background: var(--white); padding: 4px 10px; border-radius: 10px; display: inline-block; margin-top: 4px; border: 2px solid var(--border-color); font-weight: 900;}

  /* レーダーチャートの囲み */
  .chart-container {
    background: var(--white); border-radius: 15px; padding: 15px;
    border: 3px solid var(--border-color);
    box-shadow: 4px 4px 0px var(--border-color);
    margin-bottom: 20px; 
    background-image: radial-gradient(#f1f2f6 20%, transparent 21%);
    background-size: 20px 20px;
  }

  /* レベル選択ボタン */
  .level-select { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 25px; }
  .level-btn {
    flex: 1; padding: 12px 0; border: 3px solid var(--border-color); border-radius: 12px;
    background-color: #fff; color: var(--text-main); font-weight: 900; cursor: pointer;
    box-shadow: 0 5px 0px var(--border-color);
    transition: all 0.1s; font-size: 16px;
  }
  .level-btn.selected {
    background: #4bcffa; color: #fff; text-shadow: 1px 1px 0 var(--border-color);
    transform: translateY(5px); box-shadow: 0 0px 0 var(--border-color);
  }

  /* メインアクションボタン（クイズ挑戦など） */
  .action-btn {
    width: 100%; padding: 18px; border: 3px solid var(--border-color) !important; border-radius: 15px;
    background: linear-gradient(135deg, #ff9ff3 0%, #feca57 100%) !important;
    color: #fff !important; font-size: 20px; font-weight: 900; margin-bottom: 20px;
    cursor: pointer; box-shadow: 0 6px 0px var(--border-color);
    transition: transform 0.1s, box-shadow 0.1s;
    text-shadow: 2px 2px 0 var(--border-color);
    font-family: 'M PLUS Rounded 1c', sans-serif;
  }
  .action-btn:active { transform: translateY(6px); box-shadow: 0 0px 0 var(--border-color); }
  .action-btn:disabled { background: #d2dae2 !important; box-shadow: 0 6px 0 #808e9b !important; border-color: #808e9b !important; text-shadow: none !important; cursor: not-allowed; transform: none; }

  /* サブボタン（シェア、履歴、称号など） */
  .share-area { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 20px; }
  .share-area button {
    flex: 1; padding: 12px 8px; border: 3px solid var(--border-color); border-radius: 10px; font-weight: 900;
    background: #fff; color: var(--text-main); box-shadow: 0 4px 0px var(--border-color); cursor: pointer;
    transition: all 0.1s; font-size: 14px;
  }
  .share-area button:active { transform: translateY(4px); box-shadow: 0 0px 0 var(--border-color); }

  .history-link { display: flex; justify-content: space-between; gap: 8px; }
  .history-link button {
    padding: 12px 5px; background-color: #d2dae2; color: var(--text-main); border: 3px solid var(--border-color);
    border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 900; flex: 1;
    box-shadow: 0 4px 0px var(--border-color); transition: all 0.1s;
  }
  .history-link button:active { transform: translateY(4px); box-shadow: 0 0px 0 var(--border-color); }
  .dev-btn { background-color: #ffb822 !important; color: #fff !important; text-shadow: 1px 1px 0 var(--border-color); }

  /* --- 回答画面要素 --- */
  .quiz-info {
    background: #ef5777; color: #fff; text-shadow: 1px 1px 0 var(--border-color);
    border: 3px solid var(--border-color); padding: 12px; text-align: center;
    border-radius: 12px; box-shadow: 4px 4px 0px var(--border-color);
    margin-bottom: 20px; font-weight: 900; font-size: 16px;
  }
  .timer-bar {
    width: 100%; height: 16px; background-color: #fff; border-radius: 8px;
    border: 3px solid var(--border-color);
    margin-bottom: 20px; overflow: hidden; box-shadow: 4px 4px 0px var(--border-color);
  }
  .timer-fill {
    height: 100%; background: linear-gradient(90deg, #ff3f34 0%, #ffbe76 100%);
    width: 100%; transition: width 1s linear;
  }
  .question-area {
    background: #48dbfb; color: #fff; text-shadow: 1px 1px 0 var(--border-color);
    min-height: 120px; padding: 20px; border-radius: 15px; border: 3px solid var(--border-color);
    margin-bottom: 25px; display: flex; align-items: center; justify-content: center;
    font-size: 18px; text-align: center; font-weight: 900; line-height: 1.6;
    box-shadow: 4px 4px 0px var(--border-color);
  }
  .choice-btn {
    width: 100%; padding: 18px; margin-bottom: 15px; border: 3px solid var(--border-color);
    background-color: #fff; cursor: pointer; font-size: 16px; text-align: center;
    border-radius: 12px; font-weight: 900; color: var(--text-main);
    box-shadow: 0 5px 0px var(--border-color); transition: transform 0.1s, background 0.2s;
    font-family: 'M PLUS Rounded 1c', sans-serif;
  }
  .choice-btn:active { transform: translateY(5px); box-shadow: 0 0px 0 var(--border-color); background-color: #f1f2f6; }
  
  /* --- 履歴・統計・称号画面リスト --- */
  .custom-list {
    background: var(--white); height: 450px; overflow-y: auto; margin-bottom: 20px;
    padding: 15px; border-radius: 15px; border: 3px solid var(--border-color); box-shadow: 4px 4px 0px var(--border-color);
  }
  .custom-list::-webkit-scrollbar { width: 8px; }
  .custom-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

  /* 統計エリア */
  .stats-container {
    background: var(--white); max-height: 250px; overflow-y: auto; margin-bottom: 20px;
    padding: 15px; border-radius: 15px; border: 3px solid var(--border-color); box-shadow: 4px 4px 0px var(--border-color); font-size: 14px; font-weight: 900;
  }
  .stats-container::-webkit-scrollbar { width: 8px; }
  .stats-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
  .stats-section { margin-bottom: 15px; }
  .stats-section:last-child { margin-bottom: 0; }
  .stats-section-title { color: var(--white); background: #3c40c6; display: inline-block; padding: 4px 10px; border-radius: 8px; margin-bottom: 10px; border: 2px solid var(--border-color); font-size: 15px;}
  .stats-row { display: flex; justify-content: space-between; padding: 6px 0; color: var(--text-main); border-bottom: 2px dashed #d2dae2; }

  /* 履歴リストアイテム */
  .history-item { padding: 12px 10px; border-bottom: 3px dashed #d2dae2; font-weight: 900; }
  .history-item:last-child { border-bottom: none; }
  .history-item.correct { color: #05c46b; text-shadow: 1px 1px 0px rgba(0,0,0,0.1); }
  .history-item.incorrect { color: #ff3f34; text-shadow: 1px 1px 0px rgba(0,0,0,0.1); }

  /* 称号アイテム */
  .title-item {
    border: 3px solid var(--border-color); padding: 12px; display: flex; justify-content: space-between;
    align-items: center; background-color: #fff; margin-bottom: 12px; border-radius: 12px;
    box-shadow: 2px 2px 0px var(--border-color);
  }
  .title-item.locked { background: #d2dae2; box-shadow: none; border-color: #808e9b; color: #808e9b;}
  .title-info { flex: 1; margin-right: 10px; }
  .title-name { font-weight: 900; font-size: 16px; margin-bottom: 4px; color: #3c40c6; }
  .title-item.locked .title-name { color: #808e9b; }
  .title-desc { font-size: 12px; color: #575fcf; font-weight: 900; }
  .title-item.locked .title-desc { color: #808e9b; }
  
  .title-btn {
    padding: 10px 14px; background: #0fb9b1; border: 3px solid var(--border-color);
    color: #fff; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 900;
    box-shadow: 0 3px 0px var(--border-color); transition: all 0.1s; text-shadow: 1px 1px 0 var(--border-color);
  }
  .title-btn:active { transform: translateY(3px); box-shadow: 0 0px 0 var(--border-color); }
  .title-btn.current { background: #ffdd59; color: var(--text-main); text-shadow: none; }
  .title-btn:disabled { background: #808e9b; color: #d2dae2; border-color: #808e9b; box-shadow: none; cursor: not-allowed; transform: none; text-shadow: none;}
</style>
</head>
<body>

<div id="app">
  <div id="home-screen" class="screen active">
    <div class="header">🌟 アニマス 🌟</div>
    <div class="animas-name">あなたのアニマス名<br><strong id="animas-title">見習いウォッチャー</strong></div>
    
    <div class="status-bar">
      <div>総回答数 <span id="total-answers" style="color:#ff3f34; font-size:22px; text-shadow: 1px 1px 0 #fff;">0</span> 問</div>
      <div class="life-area">
        <div class="life-icons" id="life-icons">💙💙💙💙💙</div>
        <div id="life-timer">MAX</div>
      </div>
    </div>

    <div class="chart-container"><canvas id="radarChart"></canvas></div>

    <div class="level-select">
      <button class="level-btn" onclick="selectLevel(1)">Lv 1</button>
      <button class="level-btn" onclick="selectLevel(2)">Lv 2</button>
      <button class="level-btn" onclick="selectLevel(3)">Lv 3</button>
    </div>

    <button class="action-btn" id="start-btn" onclick="startQuiz()" disabled>データ読み込み中...</button>

    <div class="share-area">
      <button onclick="shareResult('copy')">📋 コピー</button>
      <button onclick="shareResult('line')" style="color:#05c46b;">💬 LINE</button>
      <button onclick="shareResult('x')" style="color:var(--text-main);">𝕏 Post</button>
    </div>
    
    <div class="history-link">
      <button onclick="recoverLifeDev()" class="dev-btn">🛠 開発:全回復</button>
      <button onclick="showTitleScreen()">🏆 称号</button>
      <button onclick="showScreen('history-screen')">📖 履歴</button>
    </div>
  </div>

  <div id="quiz-screen" class="screen">
    <div class="header">🌟 アニマス 🌟 <span style="float:right; font-size:14px; margin-top:2px;" id="quiz-level-display">Lv1</span></div>
    <div class="quiz-info" id="quiz-genre">出題アニメ名 / ジャンル</div>
    <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
    <div class="question-area" id="quiz-text">問題文</div>
    <div id="choices-area"></div>
  </div>

  <div id="history-screen" class="screen">
    <div class="header">📖 回答履歴</div>
    <div class="stats-container" id="stats-area"></div>
    <div class="custom-list" id="history-list" style="height: 180px; margin-bottom: 20px;"></div>
    <button class="action-btn" onclick="showScreen('home-screen')">🏠 ホームに戻る</button>
  </div>

  <div id="title-screen" class="screen">
    <div class="header">🏆 称号コレクション</div>
    <div class="custom-list" id="title-list"></div>
    <button class="action-btn" onclick="showScreen('home-screen')">🏠 ホームに戻る</button>
  </div>
</div>

<script>
  // --- 効果音システム (Web Audio API) ---
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let audioCtx;

  function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playTone(freq, type, duration, vol=0.1) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  function playClick() { initAudio(); playTone(800, 'sine', 0.05, 0.05); }
  function playCorrectSound() {
    initAudio();
    playTone(523.25, 'sine', 0.1, 0.1); // C5
    setTimeout(() => playTone(659.25, 'sine', 0.1, 0.1), 100); // E5
    setTimeout(() => playTone(783.99, 'sine', 0.3, 0.1), 200); // G5
  }
  function playIncorrectSound() {
    initAudio();
    playTone(200, 'sawtooth', 0.2, 0.1);
    setTimeout(() => playTone(150, 'sawtooth', 0.4, 0.1), 150);
  }

  // --- 空の配列を用意（外部ファイルから読み込みます） ---
  let questionsData = [];
  let titlesData = [];

  // --- 非同期でJSONデータを読み込む処理 ---
  async function loadGameData() {
    try {
      const qRes = await fetch('questions.json');
      if (!qRes.ok) throw new Error('questions.json が見つかりません');
      questionsData = await qRes.json();

      const tRes = await fetch('titles.json');
      if (!tRes.ok) throw new Error('titles.json が見つかりません');
      const rawTitles = await tRes.json();

      titlesData = rawTitles.map(t => {
        t.check = function(d) {
          const earned = d.stats.action + d.stats.fantasy + d.stats.scifi + d.stats.sliceOfLife + d.stats.romance - 50;
          const maxVal = Math.max(d.stats.action, d.stats.fantasy, d.stats.scifi, d.stats.sliceOfLife, d.stats.romance);
          if (t.id === 1) return true;
          if (t.id >= 2 && t.id <= 10) {
            const req = [0, 10, 50, 100, 300, 500, 1000, 2000, 5000, 10000][t.id - 1];
            return earned >= req;
          }
          if (t.id >= 11 && t.id <= 60) {
            const typeMap = {1: 'action', 2: 'fantasy', 3: 'scifi', 4: 'sliceOfLife', 5: 'romance'};
            const statName = typeMap[Math.floor((t.id - 11) / 10) + 1];
            const reqArr = [20, 50, 100, 200, 300, 500, 1000, 2000, 5000];
            const idx = (t.id - 1) % 10; 
            if (idx < 9) return (d.stats[statName] - 10) >= reqArr[idx] && maxVal === d.stats[statName];
            else return earned > 0 && (d.stats[statName] - 10) / earned >= 0.8;
          }
          if (t.id >= 61 && t.id <= 80) {
            const req = (t.id % 2 !== 0) ? 50 : 300;
            const s = [d.stats.action, d.stats.fantasy, d.stats.scifi, d.stats.sliceOfLife, d.stats.romance].sort((a,b)=>b-a);
            return (s[0] - 10) >= req && (s[1] - 10) >= req && (s[0] - s[1]) <= 20; 
          }
          if (t.id >= 81 && t.id <= 84) {
            const req = [50, 100, 300, 1000][t.id - 81];
            const minVal = Math.min(d.stats.action, d.stats.fantasy, d.stats.scifi, d.stats.sliceOfLife, d.stats.romance);
            return (minVal - 10) >= req;
          }
          if (t.id >= 92 && t.id <= 94) {
            const req = [100, 500, 1000][t.id - 92];
            return d.totalAnswers >= req;
          }
          if (t.id === 95) return d.answeredQuestions.length >= 100;
          return false; 
        };
        return t;
      });

      document.getElementById('start-btn').innerText = "▶ クイズに挑戦！";
      document.getElementById('start-btn').disabled = false;
      init();

    } catch (error) {
      console.error("データの読み込みに失敗しました:", error);
      document.getElementById('start-btn').innerText = "通信エラー";
      alert("データの読み込みに失敗しました。GitHub PagesなどのWebサーバー経由でアクセスしているか確認してください。");
    }
  }


  // --- データ保存・初期化 (localStorage) ---
  const DEFAULT_DATA = {
    life: 5, lastLifeTime: Date.now(),
    stats: { action: 10, fantasy: 10, scifi: 10, sliceOfLife: 10, romance: 10 },
    answeredQuestions: [], totalAnswers: 0, history: [],
    unlockedTitles: [1], currentTitleId: 1,
    statistics: { anime: {}, genre: {}, level: {} }
  };

  let appData = JSON.parse(localStorage.getItem('animasData')) || DEFAULT_DATA;
  if (!appData.unlockedTitles) appData.unlockedTitles = [1];
  if (!appData.currentTitleId) appData.currentTitleId = 1;
  if (!appData.statistics) appData.statistics = { anime: {}, genre: {}, level: {} };
  
  // 状態管理
  let currentLevel = null; let isAnswering = false;
  let timerInterval; let timeLeft = 10;
  let currentQuestion = null; let radarChart;

  // --- 初期化処理 ---
  function init() {
    initChart();
    checkTitleUnlocks();
    updateHomeUI();
    renderHistory();
    setInterval(checkLifeRecovery, 1000);
  }

  function saveData() { localStorage.setItem('animasData', JSON.stringify(appData)); }

  function recoverLifeDev() {
    playClick();
    appData.life = 5; appData.lastLifeTime = Date.now();
    saveData(); updateHomeUI();
    alert("【開発用】ライフを全回復しました！");
  }

  // --- シェア機能 ---
  function getShareText() {
    const t = titlesData.find(x => x.id === appData.currentTitleId);
    const titleName = t ? t.title : "見習いウォッチャー";
    const s = appData.stats;
    
    let text = `私のアニマス名は「${titleName}」です！✨\n\n`;
    text += `📊 パラメータ\n`;
    text += `⚔️ アクション: ${s.action}pt\n`;
    text += `🪄 ファンタジー: ${s.fantasy}pt\n`;
    text += `🚀 ＳＦ: ${s.scifi}pt\n`;
    text += `☕️ 日常: ${s.sliceOfLife}pt\n`;
    text += `💕 恋愛: ${s.romance}pt\n\n`;
    text += `#アニマス #アニメクイズ`;
    
    return text;
  }

  function shareResult(type) {
    playClick();
    const text = getShareText();
    
    if (type === 'copy') {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          alert("クリップボードにコピーしました！\nSNSなどに貼り付けてシェアしてください。");
        }).catch(err => {
          alert("コピーに失敗しました。");
        });
      } else {
        alert("お使いのブラウザではコピー機能がサポートされていません。");
      }
    } else if (type === 'line') {
      const url = `https://line.me/R/msg/text/?${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    } else if (type === 'x') {
      const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    }
  }

  // --- レーダーチャート ---
  function initChart() {
    const ctx = document.getElementById('radarChart').getContext('2d');
    radarChart = new Chart(ctx, {
      type: 'radar',
      data: {
        labels: ['アクション', 'ファンタジー', 'SF', '日常', '恋愛'],
        datasets: [{
          label: 'パラメータ',
          data: [appData.stats.action, appData.stats.fantasy, appData.stats.scifi, appData.stats.sliceOfLife, appData.stats.romance],
          backgroundColor: 'rgba(255, 71, 87, 0.2)',
          borderColor: 'rgb(255, 71, 87)',
          pointBackgroundColor: 'rgb(255, 71, 87)',
          borderWidth: 3
        }]
      },
      options: { 
        scales: { 
          r: { 
            min: 0, max: 100, 
            ticks: { display: false },
            pointLabels: { font: { family: "'M PLUS Rounded 1c', sans-serif", size: 12, weight: 'bold' }, color: '#2f3542' }
          } 
        },
        plugins: { legend: { display: false } }
      }
    });
  }

  function updateChart() {
    radarChart.data.datasets[0].data = [appData.stats.action, appData.stats.fantasy, appData.stats.scifi, appData.stats.sliceOfLife, appData.stats.romance];
    radarChart.update();
  }

  // --- ライフ回復ロジック ---
  function checkLifeRecovery() {
    const HOUR_MS = 60 * 60 * 1000;
    if (appData.life >= 5) {
      appData.lastLifeTime = Date.now();
      document.getElementById('life-timer').innerText = "MAX";
      saveData(); return;
    }
    const diff = Date.now() - appData.lastLifeTime;
    if (diff >= HOUR_MS) {
      const recovered = Math.floor(diff / HOUR_MS);
      appData.life = Math.min(5, appData.life + recovered);
      appData.lastLifeTime += recovered * HOUR_MS;
      saveData(); updateHomeUI();
    } else {
      const remainMs = HOUR_MS - diff;
      const remainMin = Math.floor(remainMs / (60 * 1000));
      const remainSec = Math.floor((remainMs % (60 * 1000)) / 1000);
      document.getElementById('life-timer').innerText = `あと ${String(remainMin).padStart(2, '0')}:${String(remainSec).padStart(2, '0')}`;
    }
  }

  // --- 画面遷移とUI更新 ---
  function showScreen(screenId) {
    playClick();
    if (screenId === 'history-screen') {
      renderStatistics();
    }
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function selectLevel(level) {
    playClick();
    currentLevel = level;
    document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('selected'));
    event.target.classList.add('selected');
  }

  function updateTitleDisplay() {
    const t = titlesData.find(x => x.id === appData.currentTitleId);
    document.getElementById('animas-title').innerText = t ? t.title : "見習いウォッチャー";
  }

  function updateHomeUI() {
    document.getElementById('total-answers').innerText = appData.totalAnswers;
    let lifeStr = "";
    for(let i=0; i<5; i++) { lifeStr += (i < appData.life) ? "💙" : "🤍"; }
    document.getElementById('life-icons').innerText = lifeStr;
    updateChart();
    updateTitleDisplay();
  }

  // --- クイズ開始 ---
  function startQuiz() {
    playClick();
    if (!currentLevel) { alert("レベルを選択してください！"); return; }
    if (appData.life <= 0) { alert("ライフが回復するまでお待ちください！"); return; }
    const available = questionsData.filter(q => q.level === currentLevel && !appData.answeredQuestions.includes(q.id));
    if (available.length === 0) { alert("このレベルの問題はすべてクリアしました！"); return; }

    appData.life--; saveData(); updateHomeUI();
    currentQuestion = available[Math.floor(Math.random() * available.length)];
    
    document.getElementById('quiz-level-display').innerText = `Lv${currentLevel}`;
    document.getElementById('quiz-genre').innerText = `【 ${currentQuestion.anime} 】\n${currentQuestion.genre}`;
    document.getElementById('quiz-text').innerText = currentQuestion.text;
    
    const choicesArea = document.getElementById('choices-area');
    choicesArea.innerHTML = '';
    currentQuestion.choices.forEach((choice, index) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn'; btn.innerText = choice;
      btn.onclick = () => handleAnswer(index, btn);
      choicesArea.appendChild(btn);
    });

    isAnswering = true; timeLeft = 10;
    document.getElementById('timer-fill').style.width = '100%';
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('quiz-screen').classList.add('active');
    
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById('timer-fill').style.width = `${(timeLeft / 10) * 100}%`;
      if (timeLeft <= 0) { clearInterval(timerInterval); handleTimeout(); }
    }, 1000);
  }

  // --- 統計記録処理 ---
  function recordStatistics(q, isCorrect) {
    if (!appData.statistics) appData.statistics = { anime: {}, genre: {}, level: {} };
    const s = appData.statistics;
    
    // アニメ別
    if (!s.anime[q.anime]) s.anime[q.anime] = { total: 0, correct: 0 };
    s.anime[q.anime].total++;
    if (isCorrect) s.anime[q.anime].correct++;
    
    // ジャンル別
    if (!s.genre[q.genre]) s.genre[q.genre] = { total: 0, correct: 0 };
    s.genre[q.genre].total++;
    if (isCorrect) s.genre[q.genre].correct++;
    
    // レベル別
    if (!s.level[q.level]) s.level[q.level] = { total: 0, correct: 0 };
    s.level[q.level].total++;
    if (isCorrect) s.level[q.level].correct++;
  }

  // --- 統計描画処理 ---
  function renderStatistics() {
    if (!appData.statistics) appData.statistics = { anime: {}, genre: {}, level: {} };
    const s = appData.statistics;
    let html = '';

    const makeSection = (title, dataObj, keyPrefix) => {
      let secHtml = `<div class="stats-section"><div class="stats-section-title">${title}</div>`;
      const keys = Object.keys(dataObj);
      if (keys.length === 0) {
        secHtml += `<div style="color:#999; font-size:12px;">データがありません</div>`;
      } else {
        keys.sort((a, b) => dataObj[b].total - dataObj[a].total).forEach(k => {
          const d = dataObj[k];
          const rate = d.total > 0 ? Math.round((d.correct / d.total) * 100) : 0;
          secHtml += `<div class="stats-row"><span>${keyPrefix}${k}</span><span>${d.correct}/${d.total}問 (${rate}%)</span></div>`;
        });
      }
      secHtml += `</div>`;
      return secHtml;
    };

    html += makeSection('📌 アニメ別', s.anime, '');
    html += makeSection('📌 ジャンル別', s.genre, '');
    html += makeSection('📌 レベル別', s.level, 'Lv ');

    document.getElementById('stats-area').innerHTML = html;
  }

  // --- 回答処理 ---
  function handleAnswer(selectedIndex, btnElement) {
    if (!isAnswering) return;
    isAnswering = false; clearInterval(timerInterval);
    appData.totalAnswers++;
    const isCorrect = (selectedIndex === currentQuestion.correctIndex);
    const btns = document.querySelectorAll('.choice-btn');

    recordStatistics(currentQuestion, isCorrect); 

    if (isCorrect) {
      playCorrectSound();
      btnElement.style.background = '#0be881'; // ビビッドグリーン
      btnElement.style.color = '#fff';
      const pt = currentQuestion.level;
      if(currentQuestion.genre === "アクション") appData.stats.action += pt;
      if(currentQuestion.genre === "ファンタジー") appData.stats.fantasy += pt;
      if(currentQuestion.genre === "SF") appData.stats.scifi += pt;
      if(currentQuestion.genre === "日常") appData.stats.sliceOfLife += pt;
      if(currentQuestion.genre === "恋愛") appData.stats.romance += pt;
      
      appData.answeredQuestions.push(currentQuestion.id);
      addHistory(true); checkTitleUnlocks(); saveData();
      setTimeout(() => { updateHomeUI(); document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById('home-screen').classList.add('active'); }, 1200);
    } else {
      playIncorrectSound();
      btnElement.style.background = '#ff3f34'; // ビビッドレッド
      btnElement.style.color = '#fff';
      btns[currentQuestion.correctIndex].style.background = '#0be881';
      btns[currentQuestion.correctIndex].style.color = '#fff';
      addHistory(false); checkTitleUnlocks(); saveData();
      setTimeout(() => { updateHomeUI(); document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById('home-screen').classList.add('active'); }, 2000);
    }
  }

  // --- 時間切れ処理 ---
  function handleTimeout() {
    if (!isAnswering) return;
    isAnswering = false; appData.totalAnswers++;
    playIncorrectSound();
    
    recordStatistics(currentQuestion, false); 

    const btns = document.querySelectorAll('.choice-btn');
    btns[currentQuestion.correctIndex].style.background = '#0be881';
    btns[currentQuestion.correctIndex].style.color = '#fff';
    addHistory(false, true); checkTitleUnlocks(); saveData();
    setTimeout(() => { updateHomeUI(); document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById('home-screen').classList.add('active'); }, 2000);
  }

  // --- 履歴追加 ---
  function addHistory(isCorrect, isTimeout = false) {
    let resultText = isCorrect ? "🌟 正解！" : (isTimeout ? "⏳ タイムアップ" : "💧 ザンネン...");
    let ptText = isCorrect ? `(+${currentQuestion.level}pt)` : "";
    let className = isCorrect ? "correct" : "incorrect";
    const historyStr = `<div class="history-item ${className}">
      <span style="font-size:12px; color:#a4b0be;">[Lv${currentQuestion.level}] ${currentQuestion.anime}</span><br>
      ${resultText} ${ptText}
    </div>`;
    appData.history.unshift(historyStr);
    if(appData.history.length > 50) appData.history.pop();
    renderHistory();
  }
  function renderHistory() { document.getElementById('history-list').innerHTML = appData.history.join(''); }

  // --- 称号システム ---
  function checkTitleUnlocks() {
    let unlocked = false;
    titlesData.forEach(t => {
      if (!appData.unlockedTitles.includes(t.id)) {
        if (t.check(appData)) { appData.unlockedTitles.push(t.id); unlocked = true; }
      }
    });
    if(unlocked) saveData();
  }

  function showTitleScreen() {
    playClick(); renderTitleList();
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('title-screen').classList.add('active');
  }

  function renderTitleList() {
    const list = document.getElementById('title-list');
    let html = '';
    titlesData.forEach(t => {
      const isUnlocked = appData.unlockedTitles.includes(t.id);
      const isCurrent = appData.currentTitleId === t.id;
      
      if (isUnlocked) {
        html += `
          <div class="title-item">
            <div class="title-info">
              <div class="title-name">[${t.type}] ${t.title}</div>
              <div class="title-desc">${t.condition_desc}</div>
            </div>
            <button class="title-btn ${isCurrent ? 'current' : ''}" 
                    ${isCurrent ? 'disabled' : ''} 
                    onclick="setCurrentTitle(${t.id})">
              ${isCurrent ? 'セット中' : 'セットする'}
            </button>
          </div>
        `;
      } else {
        html += `
          <div class="title-item locked">
            <div class="title-info">
              <div class="title-name">🔒 ？？？</div>
              <div class="title-desc">解放条件: ${t.condition_desc}</div>
            </div>
            <button class="title-btn" disabled>未獲得</button>
          </div>
        `;
      }
    });
    list.innerHTML = html;
  }

  function setCurrentTitle(id) {
    playClick(); appData.currentTitleId = id; saveData();
    updateHomeUI(); renderTitleList();
  }

  // ★ 起動時にJSONファイルを読み込む関数を呼び出す
  window.onload = loadGameData;
</script>
</body>
</html>
